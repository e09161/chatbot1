<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0,maximum-scale=1,minimum-scale=1.0,user-scalable=no,width=device-width,viewport-fit=cover">
    <title>DeepSeek Chat - Complete Code Handler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 260px;
            
            /* Dark theme colors */
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --sidebar-bg: #161b22;
            --border-color: #30363d;
            --hover-bg: #21262d;
            
            /* Text colors */
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6e7681;
            
            /* Accent colors */
            --accent-primary: #4f6af5;
            --accent-secondary: #6d8cff;
            --accent-gradient: linear-gradient(135deg, #4f6af5 0%, #6d8cff 100%);
            
            /* Message colors */
            --user-message-bg: #4f6af5;
            --assistant-message-bg: #21262d;
            
            /* Code block colors - GitHub Dark style */
            --code-bg: #0d1117;
            --code-text: #e5e7eb;
            --code-comment: #8b949e;
            --code-keyword: #ff7b72;
            --code-string: #a5d6ff;
            --code-function: #d2a8ff;
            --code-variable: #ffa657;
            --code-number: #79c0ff;
            
            /* Status colors */
            --success: #2ea043;
            --error: #f85149;
            --warning: #f0883e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
            background: var(--bg-primary);
        }

        .app-container {
            display: flex;
            height: 100vh;
            background: var(--bg-primary);
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .sidebar-header {
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
        }

        .logo img {
            width: 28px;
            height: 28px;
            filter: brightness(1.2);
        }

        .new-chat-btn {
            margin: 16px;
            padding: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-primary);
        }

        .new-chat-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-primary);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chat-history::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .history-item {
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            position: relative;
            border: 1px solid transparent;
            color: var(--text-secondary);
        }

        .history-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .history-item.active {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
            box-shadow: 0 2px 8px rgba(79, 106, 245, 0.2);
            color: var(--text-primary);
        }

        .history-item-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
        }

        .history-item-content {
            flex: 1;
            overflow: hidden;
        }

        .history-item-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-item-actions {
            display: none;
            gap: 4px;
        }

        .history-item:hover .history-item-actions {
            display: flex;
        }

        .action-btn {
            padding: 4px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .action-btn:hover {
            background: var(--hover-bg);
            color: var(--error);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }

        .api-status {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 12px;
        }

        .api-status-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .api-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .api-dot.active {
            background: var(--success);
            box-shadow: 0 0 0 2px rgba(46, 160, 67, 0.2);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        .chat-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary);
        }

        .api-key-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-key-input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 240px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .api-key-input:focus {
            border-color: var(--accent-primary);
        }

        .api-key-input::placeholder {
            color: var(--text-muted);
        }

        .save-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .save-btn:hover {
            opacity: 0.9;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--bg-primary);
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .message.user .message-header {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .user .message-avatar {
            background: var(--accent-gradient);
            color: white;
        }

        .assistant .message-avatar {
            background: var(--success);
            color: white;
        }

        .message-content {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .user .message-content {
            background: var(--user-message-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .message-content {
            background: var(--assistant-message-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* Code block styling */
        .code-block {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
            margin: 12px 0;
            border-left: 4px solid var(--accent-primary);
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 100%;
        }

        .code-block pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: transparent;
            border: none;
            color: inherit;
        }

        .code-block code {
            display: block;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--code-text);
            font-family: inherit;
            background: transparent;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .copy-code-btn {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-code-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        .download-code-btn {
            background: transparent;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 4px;
        }

        .download-code-btn:hover {
            background: var(--success);
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            margin-left: 36px;
            margin-right: 36px;
        }

        /* File attachments styling */
        .file-attachment {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }

        .user .file-attachment {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid var(--border-color);
        }

        .image-preview:hover {
            transform: scale(1.02);
            border-color: var(--accent-primary);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--assistant-message-bg);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* Input area */
        .input-area {
            padding: 20px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .file-upload-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .file-upload-btn {
            background: var(--bg-tertiary);
            border: 1px dashed var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .file-upload-btn:hover {
            border-color: var(--accent-primary);
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .file-upload-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .file-upload-btn:hover svg {
            fill: var(--accent-primary);
        }

        .attached-files {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .attached-file {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }

        .attached-file .remove-file {
            cursor: pointer;
            color: var(--error);
            font-weight: bold;
            margin-left: 4px;
        }

        .attached-file .remove-file:hover {
            color: #ff6b6b;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        textarea:focus {
            border-color: var(--accent-primary);
        }

        textarea:disabled {
            background: var(--bg-secondary);
            cursor: not-allowed;
            opacity: 0.7;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .usage-info {
            font-size: 12px;
            color: var(--text-muted);
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding: 20px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            cursor: pointer;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        /* Links */
        a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Error badge */
        .error-badge {
            background: var(--error);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar with Chat History -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f6af5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z'/%3E%3C/svg%3E" alt="DeepSeek">
                    <span>DeepSeek</span>
                </div>
            </div>

            <button class="new-chat-btn" onclick="createNewChat()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                New Chat
            </button>

            <div class="chat-history" id="chatHistory">
                <!-- Chat history items will be dynamically added here -->
            </div>

            <div class="sidebar-footer">
                <div class="api-status">
                    <div class="api-status-header">
                        <span class="api-dot" id="apiStatusDot"></span>
                        <span style="font-weight: 500;">API Status</span>
                    </div>
                    <div style="font-size: 11px;" id="apiStatusText">
                        No API key set
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <div class="chat-title" id="currentChatTitle">New Chat</div>
                <div class="api-key-container">
                    <input type="password" id="apiKey" class="api-key-input" placeholder="Enter DeepSeek API Key" value="">
                    <button onclick="saveApiKey()" class="save-btn">Save Key</button>
                </div>
            </div>

            <div id="messages" class="messages-container"></div>
            
            <div class="usage-info" id="usageInfo">
                💰 No limits - Using your own API key | Code-complete mode
            </div>
            
            <div class="input-area">
                <div class="file-upload-bar">
                    <label for="fileInput" class="file-upload-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                        </svg>
                        Attach Files
                    </label>
                    <input type="file" id="fileInput" multiple accept=".txt,.py,image/*" style="display: none;" onchange="handleFileSelect(event)">
                    <span style="font-size: 12px; color: var(--text-muted);">Images, .txt, .py</span>
                </div>
                
                <div id="attachedFiles" class="attached-files"></div>
                
                <div class="input-container">
                    <textarea 
                        id="userInput" 
                        placeholder="Message DeepSeek... (Shift+Enter for new line, Enter to send)" 
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button onclick="sendMessage()" id="sendBtn" class="send-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        const DEEPSEEK_API_URL = 'https://api.deepseek.com/v1/chat/completions';
        let conversations = [];
        let currentConversationId = null;
        let apiKey = '';
        let isProcessing = false;
        let attachedFiles = [];

        // Load saved data
        document.addEventListener('DOMContentLoaded', () => {
            loadApiKey();
            loadConversations();
            updateApiStatus();
            
            if (conversations.length === 0) {
                createNewChat();
            } else {
                loadConversation(conversations[0].id);
            }
        });

        function loadApiKey() {
            const savedKey = localStorage.getItem('deepseek_api_key');
            if (savedKey) {
                apiKey = savedKey;
                document.getElementById('apiKey').value = savedKey;
            }
        }

        function saveApiKey() {
            const keyInput = document.getElementById('apiKey');
            const newKey = keyInput.value.trim();
            
            if (newKey && newKey.startsWith('sk-')) {
                apiKey = newKey;
                localStorage.setItem('deepseek_api_key', newKey);
                updateApiStatus();
                
                if (currentConversationId) {
                    addSystemMessage('✅ API key saved successfully!');
                }
            } else {
                alert('Please enter a valid DeepSeek API key (starts with "sk-")');
            }
        }

        function updateApiStatus() {
            const dot = document.getElementById('apiStatusDot');
            const text = document.getElementById('apiStatusText');
            
            if (apiKey) {
                dot.className = 'api-dot active';
                text.textContent = 'API key ready';
                text.style.color = 'var(--success)';
            } else {
                dot.className = 'api-dot';
                text.textContent = 'No API key set';
                text.style.color = 'var(--text-muted)';
            }
        }

        function loadConversations() {
            const saved = localStorage.getItem('deepseek_conversations');
            if (saved) {
                try {
                    conversations = JSON.parse(saved);
                } catch (e) {
                    conversations = [];
                }
            }
        }

        function saveConversations() {
            localStorage.setItem('deepseek_conversations', JSON.stringify(conversations));
            renderChatHistory();
        }

        function renderChatHistory() {
            const historyEl = document.getElementById('chatHistory');
            historyEl.innerHTML = '';

            if (!conversations.length) return;

            conversations.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = `history-item ${conv.id === currentConversationId ? 'active' : ''}`;
                item.onclick = () => loadConversation(conv.id);
                
                const firstMessage = conv.messages?.find(m => m.role === 'user')?.content || 'New Chat';
                const title = firstMessage.substring(0, 30) + (firstMessage.length > 30 ? '...' : '');
                
                const date = new Date(conv.updatedAt).toLocaleDateString();
                
                item.innerHTML = `
                    <div class="history-item-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2z"/>
                        </svg>
                    </div>
                    <div class="history-item-content">
                        <div class="history-item-title">${escapeHtml(title)}</div>
                        <div class="history-item-date">${date}</div>
                    </div>
                    <div class="history-item-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); deleteConversation('${conv.id}')">🗑️</button>
                    </div>
                `;
                
                historyEl.appendChild(item);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function createNewChat() {
            const newId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const newConversation = {
                id: newId,
                title: 'New Chat',
                messages: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            
            conversations.push(newConversation);
            saveConversations();
            loadConversation(newId);
            
            // Add welcome message
            addWelcomeMessage();
        }

        function loadConversation(conversationId) {
            currentConversationId = conversationId;
            const conversation = conversations.find(c => c.id === conversationId);
            
            if (conversation) {
                document.getElementById('currentChatTitle').textContent = 
                    conversation.messages?.find(m => m.role === 'user')?.content?.substring(0, 30) + '...' || 'New Chat';
                
                // Load messages
                const messagesContainer = document.getElementById('messages');
                messagesContainer.innerHTML = '';
                
                if (conversation.messages) {
                    conversation.messages.forEach(msg => {
                        displayMessage(msg);
                    });
                }
            }
            
            renderChatHistory();
        }

        function deleteConversation(conversationId) {
            if (confirm('Delete this conversation?')) {
                conversations = conversations.filter(c => c.id !== conversationId);
                
                if (conversations.length === 0) {
                    createNewChat();
                } else {
                    loadConversation(conversations[0].id);
                }
                
                saveConversations();
            }
        }

        function addWelcomeMessage() {
            const welcomeMessage = {
                role: 'assistant',
                content: `🌙 **Complete Code Mode Enabled!**

👋 Hello! I'm your DeepSeek AI assistant optimized for large code generation.

**Features:**
• 📸 Image analysis
• 📄 Text files (.txt)
• 🐍 Python files (.py)
• 💻 Complete code blocks (no truncation)
• 📦 Download code as files
• 🔄 Multiple chat history

\`\`\`python
# Example: I'll generate COMPLETE code
def example_function():
    """
    This function demonstrates that I'll provide
    complete, runnable code without truncation
    """
    result = "All code will be complete!"
    print(result)
    return result

# Every function, class, and method will be included
class CodeComplete:
    def __init__(self):
        self.status = "Ready to generate full code"
    
    def generate_code(self):
        return "No more cut-off code!"
\`\`\`

Enter your API key above to start chatting!`,
                timestamp: new Date().toLocaleTimeString()
            };
            
            addMessageToCurrentConversation(welcomeMessage);
            displayMessage(welcomeMessage);
        }

        function addSystemMessage(content) {
            const systemMessage = {
                role: 'assistant',
                content: content,
                timestamp: new Date().toLocaleTimeString()
            };
            
            addMessageToCurrentConversation(systemMessage);
            displayMessage(systemMessage);
        }

        function addMessageToCurrentConversation(message) {
            const conversation = conversations.find(c => c.id === currentConversationId);
            if (conversation) {
                if (!conversation.messages) conversation.messages = [];
                conversation.messages.push(message);
                conversation.updatedAt = new Date().toISOString();
                saveConversations();
                renderChatHistory();
            }
        }

        function formatCodeBlocks(content) {
            if (!content) return '';
            
            // First, extract all code blocks
            const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
            let lastIndex = 0;
            let formatted = '';
            let match;
            
            while ((match = codeBlockRegex.exec(content)) !== null) {
                // Add text before code block
                const textBefore = content.substring(lastIndex, match.index);
                if (textBefore) {
                    formatted += textBefore.replace(/\n/g, '<br>');
                }
                
                // Format code block
                const language = match[1] || 'text';
                let code = match[2];
                
                // Ensure code is properly escaped
                code = escapeHtml(code);
                
                // Generate unique ID for copy button
                const codeId = 'code_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                formatted += `
                    <div class="code-block">
                        <div class="code-header">
                            <span>${escapeHtml(language)}</span>
                            <div>
                                <button class="copy-code-btn" onclick="copyCode('${codeId}')">Copy</button>
                                <button class="download-code-btn" onclick="downloadCode('${codeId}', '${escapeHtml(language)}')">Download</button>
                            </div>
                        </div>
                        <pre><code id="${codeId}">${code}</code></pre>
                    </div>
                `;
                
                lastIndex = match.index + match[0].length;
            }
            
            // Add remaining text
            if (lastIndex < content.length) {
                const textAfter = content.substring(lastIndex);
                formatted += textAfter.replace(/\n/g, '<br>');
            }
            
            // If no code blocks found, just replace newlines
            if (!formatted) {
                formatted = content.replace(/\n/g, '<br>');
            }
            
            return formatted;
        }

        // Global function for copying code
        window.copyCode = function(elementId) {
            const codeElement = document.getElementById(elementId);
            if (codeElement) {
                const code = codeElement.textContent;
                navigator.clipboard.writeText(code).then(() => {
                    alert('✅ Code copied to clipboard!');
                }).catch(() => {
                    alert('❌ Failed to copy code');
                });
            }
        };

        // Global function for downloading code
        window.downloadCode = function(elementId, language) {
            const codeElement = document.getElementById(elementId);
            if (codeElement) {
                const code = codeElement.textContent;
                const extension = language === 'python' ? 'py' : 
                                 language === 'javascript' ? 'js' : 
                                 language === 'html' ? 'html' : 
                                 language === 'css' ? 'css' : 'txt';
                
                const blob = new Blob([code], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `code_${Date.now()}.${extension}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        };

        function displayMessage(message) {
            const messagesDiv = document.getElementById('messages');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.role}`;
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'message-avatar';
            avatarDiv.textContent = message.role === 'user' ? 'U' : 'DS';
            
            const nameSpan = document.createElement('span');
            nameSpan.textContent = message.role === 'user' ? 'You' : 'DeepSeek';
            
            headerDiv.appendChild(avatarDiv);
            headerDiv.appendChild(nameSpan);
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Display files if any
            if (message.files && message.files.length > 0) {
                message.files.forEach(file => {
                    if (file.type?.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = file.data;
                        img.className = 'image-preview';
                        img.onclick = () => openModal(file.data);
                        contentDiv.appendChild(img);
                    } else if (file.name) {
                        const fileDiv = document.createElement('div');
                        fileDiv.className = 'file-attachment';
                        fileDiv.innerHTML = `
                            <span>${file.icon || '📎'}</span>
                            <span>${escapeHtml(file.name)}</span>
                        `;
                        contentDiv.appendChild(fileDiv);
                    }
                });
            }
            
            // Format and add message content with proper code blocks
            const formattedContent = formatCodeBlocks(message.content);
            contentDiv.innerHTML += formattedContent;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = message.timestamp || new Date().toLocaleTimeString();
            
            messageDiv.appendChild(headerDiv);
            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeDiv);
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // File handling functions
        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            
            files.forEach(file => {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    attachedFiles.push({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: e.target.result,
                        icon: getFileIcon(file.name)
                    });
                    displayAttachedFiles();
                };
                
                if (file.type.startsWith('image/')) {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
            
            event.target.value = '';
        }

        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (ext === 'py') return '🐍';
            if (ext === 'txt') return '📄';
            if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) return '📸';
            return '📎';
        }

        function displayAttachedFiles() {
            const container = document.getElementById('attachedFiles');
            container.innerHTML = '';
            
            attachedFiles.forEach((file, index) => {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'attached-file';
                
                let preview = file.icon;
                if (file.type?.startsWith('image/')) {
                    preview = `<img src="${file.data}" style="width: 20px; height: 20px; border-radius: 3px; object-fit: cover;">`;
                }
                
                fileDiv.innerHTML = `
                    ${preview}
                    <span>${escapeHtml(file.name)}</span>
                    <span class="remove-file" onclick="removeFile(${index})">✕</span>
                `;
                
                container.appendChild(fileDiv);
            });
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            displayAttachedFiles();
        }

        // Message handling
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function showTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'message assistant';
            indicatorDiv.id = 'typingIndicator';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';
            headerDiv.innerHTML = '<div class="message-avatar">DS</div><span>DeepSeek</span>';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            
            indicatorDiv.appendChild(headerDiv);
            indicatorDiv.appendChild(typingDiv);
            messagesDiv.appendChild(indicatorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Fix incomplete code blocks
        function fixIncompleteCodeBlocks(text) {
            if (!text) return text;
            
            // Count opening and closing code blocks
            const openCount = (text.match(/```/g) || []).length;
            
            // If odd number of backticks, add closing backticks
            if (openCount % 2 !== 0) {
                text += '\n```';
            }
            
            // Fix cases where code block starts but doesn't end properly
            const lines = text.split('\n');
            let inCodeBlock = false;
            let fixedLines = [];
            let codeBlockContent = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                if (line.trim().startsWith('```')) {
                    if (!inCodeBlock) {
                        // Starting a code block
                        inCodeBlock = true;
                        fixedLines.push(line);
                    } else {
                        // Ending a code block
                        inCodeBlock = false;
                        fixedLines.push(line);
                    }
                } else {
                    fixedLines.push(line);
                }
            }
            
            // If still in code block at end, close it
            if (inCodeBlock) {
                fixedLines.push('```');
            }
            
            return fixedLines.join('\n');
        }

        // Split long messages into chunks
        function splitLongMessage(message) {
            const maxChunkSize = 15000; // Safe size for most APIs
            if (message.length <= maxChunkSize) return [message];
            
            const chunks = [];
            let currentChunk = '';
            
            // Try to split at natural boundaries (code blocks, paragraphs)
            const parts = message.split(/(```[\s\S]*?```)/g);
            
            for (const part of parts) {
                if ((currentChunk + part).length > maxChunkSize) {
                    if (currentChunk) chunks.push(currentChunk);
                    currentChunk = part;
                } else {
                    currentChunk += part;
                }
            }
            
            if (currentChunk) chunks.push(currentChunk);
            return chunks;
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message && attachedFiles.length === 0) return;
            
            if (!apiKey) {
                alert('Please enter your DeepSeek API key first!');
                return;
            }
            
            // Build message with files
            let fullMessage = message;
            
            if (attachedFiles.length > 0) {
                fullMessage += '\n\n--- Attached Files ---\n';
                
                for (const file of attachedFiles) {
                    if (file.type?.startsWith('image/')) {
                        fullMessage += `\n[Image: ${file.name}]`;
                    } else {
                        try {
                            fullMessage += `\n\n--- File: ${file.name} ---\n${file.data}\n`;
                        } catch (e) {
                            console.error('Error reading file:', e);
                        }
                    }
                }
            }
            
            // Add user message
            const userMessage = {
                role: 'user',
                content: fullMessage,
                timestamp: new Date().toLocaleTimeString(),
                files: [...attachedFiles]
            };
            
            addMessageToCurrentConversation(userMessage);
            displayMessage(userMessage);
            
            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            attachedFiles = [];
            displayAttachedFiles();
            
            // Show typing indicator
            showTypingIndicator();
            
            // Disable input
            isProcessing = true;
            document.getElementById('userInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            
            try {
                const conversation = conversations.find(c => c.id === currentConversationId);
                const apiMessages = conversation.messages.map(msg => ({
                    role: msg.role,
                    content: msg.content
                }));
                
                // Add system prompt to encourage complete code
                const systemPrompt = {
                    role: 'system',
                    content: 'You are a code assistant. Always provide COMPLETE, RUNNABLE code without truncation. Never cut off code mid-way. Include all imports, functions, classes, and ensure the code is fully executable. If the code is long, provide it in full without shortening.'
                };
                
                const allMessages = [systemPrompt, ...apiMessages];
                
                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: allMessages,
                        temperature: 0.3, // Lower temperature for more consistent code
                        max_tokens: 8000, // Increased for longer responses
                        stream: false
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `API Error: ${response.status}`);
                }
                
                const data = await response.json();
                let assistantMessage = data.choices[0].message.content;
                
                // Fix any incomplete code blocks
                assistantMessage = fixIncompleteCodeBlocks(assistantMessage);
                
                removeTypingIndicator();
                
                const assistantResponse = {
                    role: 'assistant',
                    content: assistantMessage,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                addMessageToCurrentConversation(assistantResponse);
                displayMessage(assistantResponse);
                
                if (data.usage) {
                    document.getElementById('usageInfo').innerHTML = 
                        `💰 Tokens - Prompt: ${data.usage.prompt_tokens}, Completion: ${data.usage.completion_tokens}, Total: ${data.usage.total_tokens} | Code-complete mode`;
                }
                
            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();
                
                const errorMessage = {
                    role: 'assistant',
                    content: `❌ Error: ${error.message}\n\nPlease try again. If the code is very long, try requesting it in smaller chunks.`,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                addMessageToCurrentConversation(errorMessage);
                displayMessage(errorMessage);
                
            } finally {
                isProcessing = false;
                document.getElementById('userInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                userInput.focus();
            }
        }

        // Modal functions
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'flex';
            modalImg.src = imageSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Auto-resize textarea
        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Add a helper function to prettify XML
        window.prettify_xml = function(elem) {
            const roughString = ET.tostring(elem, 'utf-8')
            const reparsed = minidom.parseString(roughString)
            return reparsed.toprettyxml(indent="  ")
        };
