<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Educasa Chat · DeepSeek + DeepInfra</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 260px;
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
      z-index: 100;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    #sidebar.hidden { transform: translateX(-100%); }
    #sidebar-header {
      padding: 20px 15px;
      border-bottom: 1px solid #222;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #sidebar-header img { width: 32px; height: 32px; border-radius: 4px; }
    #new-chat-btn {
      margin: 15px; padding: 10px;
      background: #1a1a2e; border: 1px solid #333;
      border-radius: 8px; color: #e0e0e0;
      cursor: pointer; text-align: center; font-size: 14px;
    }
    #new-chat-btn:hover { background: #222; }
    #chat-list { flex: 1; overflow-y: auto; padding: 10px; }
    .chat-item {
      padding: 12px; margin: 4px 0; border-radius: 8px;
      cursor: pointer; font-size: 13px; color: #999;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-item:hover { background: #1a1a2e; color: #e0e0e0; }
    .chat-item.active { background: #1a1a2e; border: 1px solid #4a90d9; color: #e0e0e0; }
    .chat-item-title {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      user-select: none;
    }
    .chat-item-title input {
      background: #0d0d0d; border: 1px solid #4a90d9;
      color: #e0e0e0; padding: 2px 6px; font-size: 13px;
      border-radius: 4px; width: 100%; outline: none;
    }
    .chat-item-delete { color: #666; margin-left: 8px; cursor: pointer; font-weight: bold; }
    .chat-item-delete:hover { color: #f44; }

    /* ============ SIDEBAR FOOTER + COLLAPSIBLE SYNC PANEL ============ */
    #sidebar-footer {
      padding: 10px 12px 12px;
      border-top: 1px solid #222;
      font-size: 12px;
      color: #888;
    }

    #syncPanel {
      display: flex;
      flex-direction: column;
    }

    #syncPanelHeader {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: #141420;
      border: 1px solid #262626;
      border-radius: 6px;
      font-size: 11px;
      color: #9a9aa8;
      user-select: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #syncPanelHeader:hover {
      color: #ddd;
      background: #1a1a2a;
      border-color: #333;
    }
    #syncPanel.open #syncPanelHeader,
    #syncPanel:hover #syncPanelHeader {
      border-color: #4a90d9;
      color: #ddd;
    }
    #syncPanelHeader .label { display: flex; align-items: center; gap: 6px; font-weight: bold; letter-spacing: 0.3px; }
    #syncPanelHeader .chev {
      transition: transform 0.25s ease;
      font-size: 10px;
      color: #666;
    }
    #syncPanel.open #syncPanelHeader .chev,
    #syncPanel:hover #syncPanelHeader .chev { transform: rotate(180deg); color: #4a90d9; }

    #syncPanelHeader .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 6px rgba(76,175,80,0.6);
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #syncPanelBody {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s ease, margin-top 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0;
    }
    #syncPanel:hover #syncPanelBody,
    #syncPanel.open #syncPanelBody {
      max-height: 700px;
      opacity: 1;
      margin-top: 8px;
    }

    .sync-btns { display: flex; gap: 6px; }
    .sync-btn {
      background: #2a2a3a; border: 1px solid #444; color: #ccc;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
      flex: 1; text-align: center;
    }
    .sync-btn:hover { background: #3a3a4a; }

    .opt-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #9a9aa8; user-select: none; cursor: pointer;
    }
    #folderList { display: flex; flex-direction: column; gap: 4px; max-height: 130px; overflow-y: auto; }
    .folder-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #bbb;
      padding: 4px 6px; background: #141420;
      border: 1px solid #262626; border-radius: 6px;
    }
    .folder-item .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-item .fstate { cursor: pointer; font-size: 12px; }
    .folder-item .fdel { cursor: pointer; color: #777; font-weight: bold; }
    .folder-item .fdel:hover { color: #f44; }

    #lastSyncInfo {
      font-size: 11px;
      color: #7a7a8a;
      padding: 4px 2px 0;
      line-height: 1.5;
      word-break: break-word;
    }
    #lastSyncInfo .src { color: #4a90d9; font-weight: bold; }
    #lastSyncInfo .own { color: #4caf50; font-weight: bold; }
    #lastSyncInfo .when { color: #bbb; }

    #autoExportStatus { font-size: 11px; color: #7a7a8a; line-height: 1.4; }
    #sidebarStatus { font-size: 11px; color: #888; padding-top: 4px; border-top: 1px solid #222; }
    /* ================================================================= */

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #1a1a2e;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }
    #main.full-width { margin-left: 0; }

    #header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 20px;
      background: #0d0d0d;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #222;
      flex-wrap: wrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #toggleSidebarBtn {
      background: none;
      border: 1px solid #444;
      color: #ccc;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: none;
      line-height: 1;
    }
    #header input {
      background: #1a1a2e; border: 1px solid #333;
      color: #e0e0e0; padding: 8px 12px;
      border-radius: 6px; font-size: 13px; width: 200px;
    }
    #header button, #header select {
      padding: 8px 12px; background: #4a90d9;
      color: white; border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    #header button:hover { background: #357abd; }
    #header select {
      background: #1a1a2e; color: #e0e0e0; border: 1px solid #333;
    }
    #providerSelect {
      border: 1px solid #4a90d9 !important;
      font-weight: bold;
    }
    #validateAllBtn { background: #ff9800; }
    #validateAllBtn:hover { background: #f57c00; }
    #status { font-size: 12px; margin-left: auto; color: #4caf50; }

    #permissionBanner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 15px;
      background: #b8860b;
      color: #fff;
      font-size: 13px;
      border-bottom: 1px solid #8a6508;
    }
    #permissionBanner.show { display: flex; }
    #permissionBanner button {
      background: #4a90d9;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #permissionBanner button:hover { background: #357abd; }
    #permissionBanner #dismissBannerBtn {
      background: transparent;
      font-size: 14px;
      margin-left: auto;
      padding: 2px 8px;
    }
    #permissionBanner #dismissBannerBtn:hover { background: rgba(0,0,0,0.2); }

    #searchToggle {
      background: none;
      border: 1px solid #555;
      color: #ccc;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    #searchContainer {
      display: none;
      align-items: center;
      gap: 4px;
      position: relative;
    }
    #searchContainer.visible { display: flex; }
    #searchInput {
      background: #1a1a2e;
      border: 1px solid #4a90d9;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      width: 180px;
    }
    #searchNav { display: flex; gap: 2px; }
    #searchNav button {
      background: #333; color: #ccc;
      border: none; padding: 4px 8px;
      border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    #searchNav button:hover { background: #444; }
    #searchResults {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 0 0 6px 6px;
      z-index: 20;
      font-size: 12px;
    }
    #searchResults.visible { display: block; }
    .search-result-item {
      padding: 8px 10px; cursor: pointer;
      border-bottom: 1px solid #222;
      display: flex; flex-direction: column;
    }
    .search-result-item:hover { background: #1a1a2e; }
    .search-result-chat {
      font-weight: bold; color: #4a90d9;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .search-result-snippet {
      color: #aaa;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .search-highlight {
      background: #ff9800; color: #000;
      border-radius: 2px; padding: 0 2px;
    }
    .search-current-highlight {
      background: #f44336; color: white;
      border-radius: 2px; padding: 0 2px;
    }
    #matchCounter { font-size: 12px; color: #ccc; margin-left: 5px; }

    #messages {
      flex: 1; padding: 20px;
      max-width: 850px; margin: 0 auto; width: 100%;
    }
    .msg {
      margin-bottom: 20px; padding: 15px; border-radius: 10px;
      max-width: 85%; word-break: break-word;
      font-size: 14px; line-height: 1.6;
      position: relative;
    }
    .user { background: #16213e; margin-left: auto; }
    .assistant { background: #0f3460; margin-right: auto; }

    .msg .delete-msg {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0,0,0,0.6);
      color: #ccc;
      border: 1px solid #444;
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 5;
    }
    .msg:hover .delete-msg { opacity: 1; }
    .msg .delete-msg:hover {
      background: #d94a4a;
      color: white;
      border-color: #d94a4a;
    }

    .msg h1, .msg h2, .msg h3 { color: #4a90d9; margin: 15px 0 10px; }
    .msg h1 { font-size: 1.5em; }
    .msg h2 { font-size: 1.3em; }
    .msg h3 { font-size: 1.1em; }
    .msg table { border-collapse: collapse; width: 100%; margin: 15px 0; display: block; overflow-x: auto; }
    .msg th, .msg td { border: 1px solid #444; padding: 8px 12px; text-align: left; white-space: normal; }
    .msg th { background: #222; font-weight: bold; color: #4a90d9; }
    .msg hr { border: 0; border-top: 1px solid #333; margin: 15px 0; }
    .msg strong { color: #fff; font-weight: 600; }
    .msg em { color: #ccc; }
    .msg blockquote { border-left: 3px solid #4a90d9; padding-left: 15px; margin: 10px 0; color: #aaa; }
    .msg ul, .msg ol { margin: 10px 0; padding-left: 25px; }
    .msg li { margin: 5px 0; }
    .msg code:not(pre code) { background: #222; padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: #a8d8a8; font-size: 0.9em; }
    .msg p { margin: 8px 0; }

    .code-block { background: #0d0d0d; border: 1px solid #333; border-radius: 8px; margin: 10px 0; overflow: hidden; }
    .code-header { background: #222; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #888; flex-wrap: wrap; }
    .code-header button { background: #333; color: #ccc; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 5px; }
    .code-header button:hover { background: #444; }
    .code-content { padding: 15px; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; overflow-x: auto; color: #a8d8a8; }
    .validation-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: 8px; }
    .validation-pass { background: #1b5e20; color: #4caf50; }
    .validation-warn { background: #e65100; color: #ff9800; }
    .validation-error { background: #b71c1c; color: #f44336; }
    .validation-details { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-top: 8px; font-size: 12px; font-family: 'Courier New', monospace; display: none; }
    .validation-details.show { display: block; }
    .error-line { color: #f44336; }
    .warn-line { color: #ff9800; }
    .ok-line { color: #4caf50; }

    #input-area {
      position: sticky; bottom: 0; z-index: 10;
      background: #0d0d0d; padding: 15px 20px;
      display: flex; flex-direction: column; gap: 8px;
      max-width: 850px; margin: 0 auto; width: 100%;
      border-top: 1px solid #222;
      transition: background 0.2s, border 0.2s;
    }
    #input-area.drag-over { background: #1a1a3e; border-top: 2px dashed #4a90d9; }
    .attached-files { display: flex; flex-wrap: wrap; gap: 6px; }
    .attached-file { background: #1a1a2e; border: 1px solid #333; border-radius: 16px; padding: 4px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; color: #ccc; }
    .attached-file .remove-file { cursor: pointer; color: #888; font-weight: bold; }
    .attached-file .remove-file:hover { color: #f44; }
    .input-row { display: flex; gap: 10px; align-items: center; }
    #userInput { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a2e; color: #e0e0e0; font-family: inherit; font-size: 14px; resize: none; outline: none; }
    #userInput:focus { border-color: #4a90d9; }
    #sendBtn, #stopBtn, #attachBtn { padding: 12px 16px; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    #sendBtn { background: #4a90d9; }
    #sendBtn:hover { background: #357abd; }
    #sendBtn:disabled { opacity: 0.5; }
    #stopBtn { background: #d94a4a; }
    #stopBtn:hover { background: #c0392b; }
    #attachBtn { background: #555; }
    #attachBtn:hover { background: #666; }
    .drag-hint { font-size: 11px; color: #666; text-align: center; }

    /* ============ TOASTS ============ */
    #toastContainer {
      position: fixed;
      bottom: 90px;
      right: 20px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 320px;
      pointer-events: none;
    }
    .toast {
      background: #0f3460;
      border: 1px solid #4a90d9;
      color: #e0e0e0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      pointer-events: auto;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      cursor: default;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: #4caf50; background: #14371f; }
    .toast.warn { border-color: #ff9800; background: #3a2a0f; }
    .toast.clickable { cursor: pointer; }
    .toast.clickable:hover { background: #14406e; }
    .toast .toast-title { font-weight: bold; color: #fff; margin-bottom: 2px; }
    .toast .toast-actions { display: flex; gap: 6px; margin-top: 6px; }
    .toast .toast-actions button {
      background: #4a90d9;
      border: none;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .toast .toast-actions button:hover { background: #357abd; }
    .toast .toast-actions button.ghost {
      background: transparent;
      border: 1px solid #4a90d9;
      color: #4a90d9;
    }
    /* ================================ */

    @media (max-width: 600px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.visible { transform: translateX(0); box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
      #main { margin-left: 0; }
      #toggleSidebarBtn { display: inline-block; }
      #header { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 10px; }
      #header input { width: 120px; }
      #searchInput { width: 120px; }
      #messages { padding: 10px; }
      .msg { max-width: 95%; }
      #input-area { padding: 10px; }
      .drag-hint { display: none; }
      #toastContainer { right: 10px; left: 10px; max-width: none; bottom: 80px; }
    }
    @media (max-width: 400px) {
      #header input { width: 80px; font-size: 11px; }
      #header button, #header select { padding: 6px 8px; font-size: 11px; }
      #toggleSidebarBtn { font-size: 16px; padding: 3px 6px; }
      #sendBtn, #stopBtn, #attachBtn { padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <img src="https://educasa.pe/wp-content/uploads/2025/05/cropped-educasa_chamilo_big-1.png" alt="Educasa logo">
    Educasa Chat
  </div>
  <div id="new-chat-btn">+ New Chat</div>
  <div id="chat-list"></div>

  <div id="sidebar-footer">
    <div id="syncPanel">
      <div id="syncPanelHeader" title="Hover to expand · Click to pin open">
        <span class="label">
          <span>⚙️</span>
          <span>Sync &amp; Files</span>
        </span>
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="dot" id="syncPanelDot"></span>
          <span class="chev">▼</span>
        </span>
      </div>
      <div id="syncPanelBody">
        <div class="sync-btns">
          <button class="sync-btn" id="exportChatsBtn">📤 Export</button>
          <button class="sync-btn" id="importChatsBtn">📥 Import</button>
        </div>
        <div class="sync-btns">
          <button class="sync-btn" id="connectFolderBtn" title="Connect a local or network folder">📁 Add folder</button>
          <button class="sync-btn" id="syncNowBtn" title="Export + import newest right now">🔄 Sync now</button>
        </div>
        <div id="folderList"></div>
        <div id="lastSyncInfo">🔎 No sync yet this session</div>
        <label class="opt-row">
          <input type="checkbox" id="autoExportToggle" checked>
          Auto-export 15 min after last inquiry
        </label>
        <div id="autoExportStatus">⏱ Auto-export: armed on next inquiry</div>
        <div id="sidebarStatus">⚡ API status</div>
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div id="header">
    <button id="toggleSidebarBtn" title="Toggle sidebar">☰</button>

    <select id="providerSelect" title="Choose API provider">
      <option value="deepseek">🧠 DeepSeek API</option>
      <option value="deepinfra">☁️ DeepInfra</option>
    </select>

    <span style="color:#888;">Key:</span>
    <input type="password" id="apiKey" placeholder="API key...">
    <button id="saveKeyBtn">Save</button>

    <select id="modelSelect"></select>

    <label style="color:#888; font-size:12px; display:flex; align-items:center; gap:4px;">
      <input type="checkbox" id="thinkingToggle"> High Effort
    </label>

    <button id="validateAllBtn">🔍 Validate</button>
    <button id="searchToggle" title="Search messages">🔍</button>
    <div id="searchContainer">
      <input type="text" id="searchInput" placeholder="Search all chats...">
      <div id="searchNav">
        <button id="prevMatch" title="Previous match">▲</button>
        <button id="nextMatch" title="Next match">▼</button>
      </div>
      <span id="matchCounter"></span>
      <div id="searchResults"></div>
    </div>
    <span id="status">⚪</span>
  </div>

  <div id="permissionBanner">
    <span id="permissionBannerText"></span>
    <button id="regrantBtn">Reconnect now</button>
    <button id="dismissBannerBtn" title="Dismiss">✕</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div class="attached-files" id="attachedFiles"></div>
    <div class="input-row">
      <textarea id="userInput" rows="1" placeholder="Message Educasa Chat... Drag & drop files here"></textarea>
      <button id="attachBtn" title="Attach files">📎</button>
      <button id="sendBtn">Send</button>
      <button id="stopBtn" style="display:none;">Stop</button>
    </div>
    <div class="drag-hint">Drop .py .xml .txt .html .js .css .json .md .csv (max 1MB each)</div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept=".py,.xml,.txt,.html,.js,.css,.json,.md,.csv" style="display:none;">

<div id="toastContainer"></div>

<script>
  (function() {
    // ===== PROVIDER CONFIGURATION =====
    const PROVIDERS = {
      deepseek: {
        name: 'DeepSeek',
        url: 'https://api.deepseek.com/chat/completions',
        keyStorage: 'ds_key_deepseek',
        modelStorage: 'ds_model_deepseek',
        keyPlaceholder: 'sk-...',
        defaultModel: 'deepseek-v4-pro',
        models: [
          { id: 'deepseek-v4-pro',       label: 'DeepSeek V4 Pro' },
          { id: 'deepseek-v4-flash-4.1', label: 'DeepSeek V4 Flash 4.1' },
          { id: 'deepseek-v4-flash',     label: 'DeepSeek V4 Flash (legacy)' },
          { id: 'deepseek-chat',         label: 'deepseek-chat (legacy)' },
          { id: 'deepseek-reasoner',     label: 'deepseek-reasoner (legacy)' }
        ],
        buildBody(base, { thinking }) {
          const body = { ...base };
          if (thinking) {
            body.thinking = { type: 'enabled' };
            body.reasoning_effort = 'high';
          }
          return body;
        }
      },
      deepinfra: {
        name: 'DeepInfra',
        url: 'https://api.deepinfra.com/v1/openai/chat/completions',
        keyStorage: 'ds_key_deepinfra',
        modelStorage: 'ds_model_deepinfra',
        keyPlaceholder: 'deepinfra key...',
        defaultModel: 'deepseek-ai/DeepSeek-V4-Pro-0813',
        models: [
          { id: 'deepseek-ai/DeepSeek-V4-Pro-0813',   label: 'DeepSeek V4 Pro' },
          { id: 'deepseek-ai/DeepSeek-V4-Flash-0731', label: 'DeepSeek V4 Flash' }
        ],
        buildBody(base, { thinking }) {
          const body = { ...base };
          if (thinking) body.reasoning_effort = 'high';
          return body;
        }
      }
    };

    // IndexedDB
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('ds_chat_storage', 2);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('chats')) db.createObjectStore('chats');
          if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }
    async function loadChatsFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readonly');
        const store = tx.objectStore('chats');
        const request = store.get('ds_chats');
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }
    async function saveChatsToDB(chatsArray) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readwrite');
        const store = tx.objectStore('chats');
        store.put(chatsArray, 'ds_chats');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function loadHandlesFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readonly');
        const request = tx.objectStore('handles').get('dirs');
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }
    async function saveHandlesToDB(list) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(list, 'dirs');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // App state
    let provider = localStorage.getItem('ds_provider') || 'deepseek';
    let apiKey = '';
    let chats = [];
    let currentChatId = null;
    let isProcessing = false;
    let controller = null;
    let attachedFiles = [];
    let searchQuery = '';
    let allMatches = [];
    let currentMatchIdx = -1;

    const MACHINE_ID = (localStorage.getItem('ds_machine_id') ||
      (() => {
        const id = 'm' + Math.random().toString(36).substring(2, 7);
        localStorage.setItem('ds_machine_id', id);
        return id;
      })());

    const providerSelect   = document.getElementById('providerSelect');
    const apiKeyInput      = document.getElementById('apiKey');
    const modelSelect      = document.getElementById('modelSelect');
    const thinkingToggle   = document.getElementById('thinkingToggle');
    const statusEl         = document.getElementById('status');
    const sidebarStatus    = document.getElementById('sidebarStatus');
    const chatListEl       = document.getElementById('chat-list');
    const messagesEl       = document.getElementById('messages');
    const userInput        = document.getElementById('userInput');
    const sendBtn          = document.getElementById('sendBtn');
    const stopBtn          = document.getElementById('stopBtn');
    const attachBtn        = document.getElementById('attachBtn');
    const fileInput        = document.getElementById('fileInput');
    const inputArea        = document.getElementById('input-area');
    const attachedFilesContainer = document.getElementById('attachedFiles');
    const sidebar          = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const mainEl           = document.getElementById('main');
    const searchToggle     = document.getElementById('searchToggle');
    const searchContainer  = document.getElementById('searchContainer');
    const searchInput      = document.getElementById('searchInput');
    const searchResults    = document.getElementById('searchResults');
    const prevMatchBtn     = document.getElementById('prevMatch');
    const nextMatchBtn     = document.getElementById('nextMatch');
    const matchCounter     = document.getElementById('matchCounter');
    const toastContainer   = document.getElementById('toastContainer');

    // Collapsible sync panel
    const syncPanel        = document.getElementById('syncPanel');
    const syncPanelHeader  = document.getElementById('syncPanelHeader');
    const syncPanelDot     = document.getElementById('syncPanelDot');

    if (localStorage.getItem('ds_syncpanel_open') === 'true') {
      syncPanel.classList.add('open');
    }
    syncPanelHeader.addEventListener('click', () => {
      syncPanel.classList.toggle('open');
      localStorage.setItem('ds_syncpanel_open', syncPanel.classList.contains('open'));
    });

    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
    }

    // ===== TOAST HELPER =====
    function showToast(html, { kind = 'info', duration = 5000, onAction = null, actionLabel = null } = {}) {
      const el = document.createElement('div');
      el.className = 'toast' + (kind === 'success' ? ' success' : kind === 'warn' ? ' warn' : '');
      el.innerHTML = html;

      if (actionLabel && onAction) {
        const actions = document.createElement('div');
        actions.className = 'toast-actions';
        const btn = document.createElement('button');
        btn.textContent = actionLabel;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          onAction();
          dismiss();
        });
        const close = document.createElement('button');
        close.className = 'ghost';
        close.textContent = 'Dismiss';
        close.addEventListener('click', (e) => { e.stopPropagation(); dismiss(); });
        actions.appendChild(btn);
        actions.appendChild(close);
        el.appendChild(actions);
      }

      toastContainer.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));

      let timer = duration > 0 ? setTimeout(dismiss, duration) : null;
      function dismiss() {
        if (timer) { clearTimeout(timer); timer = null; }
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }
      return dismiss;
    }

    function toggleSidebar() {
      sidebar.classList.toggle('visible');
      if (window.innerWidth <= 600) {
        mainEl.classList.toggle('full-width', !sidebar.classList.contains('visible'));
      }
    }
    toggleSidebarBtn.addEventListener('click', toggleSidebar);

    function handleChatSelection() {
      if (window.innerWidth <= 600) {
        sidebar.classList.remove('visible');
        mainEl.classList.add('full-width');
      }
    }
    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
    }

    // ===== PROVIDER LOGIC =====
    function getProvider() { return PROVIDERS[provider]; }

    function populateModels() {
      const p = getProvider();
      modelSelect.innerHTML = '';
      p.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label;
        modelSelect.appendChild(opt);
      });
      const saved = localStorage.getItem(p.modelStorage);
      const valid = p.models.some(m => m.id === saved);
      modelSelect.value = valid ? saved : p.defaultModel;
      localStorage.setItem(p.modelStorage, modelSelect.value);
    }

    function loadApiKeyForProvider() {
      apiKey = localStorage.getItem(getProvider().keyStorage) || '';
      apiKeyInput.value = apiKey;
      apiKeyInput.placeholder = getProvider().keyPlaceholder;
    }

    function switchProvider(newProvider) {
      if (!PROVIDERS[newProvider]) return;
      provider = newProvider;
      localStorage.setItem('ds_provider', provider);
      providerSelect.value = provider;
      populateModels();
      loadApiKeyForProvider();
      updateStatus();
    }

    providerSelect.addEventListener('change', () => switchProvider(providerSelect.value));

    document.getElementById('saveKeyBtn').addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem(getProvider().keyStorage, apiKey);
      updateStatus();
    });

    modelSelect.addEventListener('change', () => {
      localStorage.setItem(getProvider().modelStorage, modelSelect.value);
      updateStatus();
    });

    thinkingToggle.addEventListener('change', () => {
      localStorage.setItem('ds_thinking', thinkingToggle.checked);
    });

    function updateStatus() {
      const p = getProvider();
      const model = modelSelect.value;
      if (apiKey) {
        statusEl.textContent = `✅ ${p.name} | ${model}`;
        statusEl.style.color = '#4caf50';
        sidebarStatus.textContent = `✅ ${p.name}`;
        sidebarStatus.style.color = '#4caf50';
      } else {
        statusEl.textContent = `❌ Set ${p.name} key`;
        statusEl.style.color = '#f44';
        sidebarStatus.textContent = `❌ No ${p.name} key`;
        sidebarStatus.style.color = '#f44';
      }
    }

    async function saveChats() {
      try { await saveChatsToDB(chats); }
      catch (e) { alert('❌ Failed to save chats: ' + e.message); }
    }

    function getChatTitle(chat) {
      if (chat.title && chat.title.trim()) return chat.title;
      const first = chat.messages.find(m => m.role === 'user');
      return first ? first.content.substring(0, 35) : 'New Chat';
    }

    const clickTimers = {};
    function renderChatList() {
      chatListEl.innerHTML = '';
      chats.sort((a, b) => b.updatedAt - a.updatedAt);
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
        const titleSpan = document.createElement('span');
        titleSpan.className = 'chat-item-title';
        titleSpan.textContent = getChatTitle(chat);
        titleSpan.addEventListener('dblclick', (e) => {
          e.preventDefault(); e.stopPropagation();
          if (clickTimers[chat.id]) { clearTimeout(clickTimers[chat.id]); delete clickTimers[chat.id]; }
          startRename(chat, titleSpan);
        });
        titleSpan.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          if (clickTimers[chat.id]) return;
          clickTimers[chat.id] = setTimeout(() => {
            delete clickTimers[chat.id];
            loadChat(chat.id); handleChatSelection();
          }, 300);
        });
        const delSpan = document.createElement('span');
        delSpan.className = 'chat-item-delete';
        delSpan.textContent = '×';
        delSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          if (clickTimers[chat.id]) { clearTimeout(clickTimers[chat.id]); delete clickTimers[chat.id]; }
          deleteChat(chat.id);
        });
        div.appendChild(titleSpan);
        div.appendChild(delSpan);
        chatListEl.appendChild(div);
      });
    }

    async function startRename(chat, span) {
      const currentTitle = getChatTitle(chat);
      const input = document.createElement('input');
      input.value = currentTitle;
      span.innerHTML = '';
      span.appendChild(input);
      input.focus(); input.select();
      const finish = async () => {
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== currentTitle) chat.title = newTitle;
        else if (!newTitle) delete chat.title;
        chat.updatedAt = Date.now();
        await saveChats();
        renderChatList();
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        else if (e.key === 'Escape') {
          span.innerHTML = ''; span.textContent = currentTitle;
          input.removeEventListener('blur', onBlur);
        }
      });
      const onBlur = () => finish();
      input.addEventListener('blur', onBlur);
    }

    function newChat() {
      currentChatId = 'chat_' + Date.now();
      chats.push({ id: currentChatId, messages: [], createdAt: Date.now(), updatedAt: Date.now() });
      saveChats();
      renderChatList();
      messagesEl.innerHTML = ''; attachedFiles = []; renderAttachedFiles();
      clearSearch();
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      messagesEl.innerHTML = ''; attachedFiles = []; renderAttachedFiles();
      if (chat?.messages) {
        chat.messages.forEach((m, idx) => {
          const msgDiv = createMessageElement(chat.id, idx, m.role, formatContent(m.content));
          messagesEl.appendChild(msgDiv);
        });
        scrollToBottom();
        setTimeout(validateAllCodeBlocks, 400);
      }
      renderChatList();
      if (searchQuery) applySearchHighlights();
    }

    async function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      if (currentChatId === id) { currentChatId = null; messagesEl.innerHTML = ''; }
      if (!chats.length) newChat();
      else if (!currentChatId) loadChat(chats[0].id);
      await saveChats();
      renderChatList();
      if (searchQuery) performSearch(searchQuery);
    }

    document.getElementById('new-chat-btn').addEventListener('click', () => {
      newChat(); handleChatSelection();
    });

    function processFiles(files) {
      const allowed = ['.py','.xml','.txt','.html','.js','.css','.json','.md','.csv'];
      Array.from(files).forEach(file => {
        const ext = '.' + file.name.split('.').pop().toLowerCase();
        if (!allowed.includes(ext)) { alert(`"${file.name}" not allowed`); return; }
        if (file.size > 1024*1024) { alert(`"${file.name}" too large`); return; }
        if (attachedFiles.find(f => f.name === file.name)) { alert(`"${file.name}" already attached`); return; }
        const reader = new FileReader();
        reader.onload = (e) => {
          attachedFiles.push({ name: file.name, type: file.type, size: file.size, content: e.target.result, icon: getFileIcon(file.name) });
          renderAttachedFiles();
        };
        reader.onerror = () => alert(`Failed to read ${file.name}`);
        reader.readAsText(file);
      });
    }
    function getFileIcon(name) {
      const icons = { py:'🐍', xml:'📰', txt:'📄', html:'🌐', js:'📜', css:'🎨', json:'📋', md:'📘', csv:'📊' };
      return icons[name.split('.').pop().toLowerCase()] || '📎';
    }
    function renderAttachedFiles() {
      attachedFilesContainer.innerHTML = '';
      attachedFiles.forEach((f, i) => {
        const chip = document.createElement('div');
        chip.className = 'attached-file';
        chip.innerHTML = `${f.icon} ${escapeHtml(f.name)} (${(f.size/1024).toFixed(1)}KB) <span class="remove-file">×</span>`;
        chip.querySelector('.remove-file').addEventListener('click', () => { attachedFiles.splice(i,1); renderAttachedFiles(); });
        attachedFilesContainer.appendChild(chip);
      });
    }

    ['dragenter','dragover','dragleave','drop'].forEach(ev => {
      document.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
    });
    inputArea.addEventListener('dragenter', () => inputArea.classList.add('drag-over'));
    inputArea.addEventListener('dragover', () => inputArea.classList.add('drag-over'));
    inputArea.addEventListener('dragleave', () => inputArea.classList.remove('drag-over'));
    inputArea.addEventListener('drop', e => {
      inputArea.classList.remove('drag-over');
      if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
    });
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) processFiles(e.target.files);
      fileInput.value = '';
    });

    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    const PURIFY_CONFIG = {
      FORBID_TAGS: ['style', 'script', 'iframe', 'object', 'embed', 'link', 'meta', 'base', 'form', 'input', 'button'],
      FORBID_ATTR: ['style', 'onerror', 'onload', 'onclick', 'onmouseover', 'onfocus', 'onblur', 'onmouseenter', 'onmouseleave', 'onkeydown', 'onkeyup', 'onkeypress', 'onsubmit', 'onchange', 'oninput']
    };
    function sanitize(html) {
      if (typeof DOMPurify !== 'undefined') {
        return DOMPurify.sanitize(html, PURIFY_CONFIG);
      }
      return escapeHtml(html);
    }

    function formatContent(content) {
      if (!content) return '';
      const parts = content.split('```');
      let html = '';
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          if (parts[i].trim()) {
            const raw = typeof marked !== 'undefined'
              ? marked.parse(parts[i])
              : escapeHtml(parts[i]).replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
            html += sanitize(raw);
          }
        } else {
          const code = parts[i];
          const nl = code.indexOf('\n');
          const lang = nl > -1 ? code.substring(0, nl).trim() : 'code';
          const codeContent = nl > -1 ? code.substring(nl + 1) : code;
          const id = 'c' + Math.random().toString(36).substring(2, 10);
          const ext = lang === 'python' ? 'py' : lang === 'xml' ? 'xml' : lang === 'html' ? 'html' : 'txt';
          html += `<div class="code-block" data-code-id="${id}">
            <div class="code-header">
              <span>${escapeHtml(lang)} <span class="validation-badge" id="badge-${id}"></span></span>
              <span>
                <button class="copy-btn" data-id="${id}">Copy</button>
                <button class="download-btn" data-id="${id}" data-ext="${ext}">Download</button>
                <button class="validate-btn" data-id="${id}" style="background:#ff9800;">🔍</button>
              </span>
            </div>
            <div class="code-content"><code id="${id}">${escapeHtml(codeContent.trim())}</code></div>
            <div class="validation-details" id="details-${id}"></div>
          </div>`;
        }
      }
      return html;
    }

    function createMessageElement(chatId, msgIdx, role, contentHTML) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.dataset.chatId = chatId;
      div.dataset.msgIdx = msgIdx;
      div.style.position = 'relative';
      div.innerHTML = contentHTML;
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-msg';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Delete message';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteMessage(chatId, msgIdx);
      });
      div.appendChild(delBtn);
      return div;
    }

    async function deleteMessage(chatId, msgIdx) {
      if (isProcessing) {
        alert('Please wait for the current response to finish before deleting messages.');
        return;
      }
      const chat = chats.find(c => c.id === chatId);
      if (!chat || msgIdx < 0 || msgIdx >= chat.messages.length) return;
      if (!confirm('Delete this message?')) return;
      chat.messages.splice(msgIdx, 1);
      chat.updatedAt = Date.now();
      await saveChats();
      if (currentChatId === chatId) loadChat(chatId);
      renderChatList();
      if (searchQuery) applySearchHighlights();
      scheduleAutoExport();
    }

    document.addEventListener('click', e => {
      if (e.target.classList.contains('copy-btn')) {
        const el = document.getElementById(e.target.dataset.id);
        if (el) navigator.clipboard.writeText(el.textContent);
      }
      if (e.target.classList.contains('download-btn')) {
        const el = document.getElementById(e.target.dataset.id);
        if (el) {
          const name = `chat_${Date.now().toString(36)}_${Math.random().toString(36).substring(2,6)}.${e.target.dataset.ext}`;
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([el.textContent], {type:'text/plain'}));
          a.download = name; a.click(); URL.revokeObjectURL(a.href);
        }
      }
      if (e.target.classList.contains('validate-btn')) validateCodeBlock(e.target.dataset.id);
    });

    function detectLang(c) {
      if (/^(import |from |def |class )/m.test(c)) return 'python';
      if (/^<\?xml|<manifest/i.test(c)) return 'xml';
      return 'text';
    }
    function validatePython(c) {
      const issues = [];
      let p=0,b=0,br=0;
      for (const ch of c) {
        if (ch==='(') p++; else if (ch===')') p--;
        else if (ch==='[') b++; else if (ch===']') b--;
        else if (ch==='{') br++; else if (ch==='}') br--;
      }
      if (p) issues.push({line:0,type:'error',msg:`Parentheses: ${p}`});
      if (b) issues.push({line:0,type:'error',msg:`Brackets: ${b}`});
      if (br) issues.push({line:0,type:'warn',msg:`Braces: ${br}`});
      const last = c.split('\n').pop()?.trim();
      if (last && /[=(,\\]$/.test(last)) issues.push({line:c.split('\n').length,type:'warn',msg:'Possibly truncated'});
      return issues;
    }
    function validateGeneric(c) {
      const issues = [];
      const count = (ch) => (c.match(new RegExp('\\'+ch,'g'))||[]).length;
      const p = count('(')-count(')'), b = count('[')-count(']'), br = count('{')-count('}');
      if (p) issues.push({line:0,type:'error',msg:`Parentheses: ${p}`});
      if (b) issues.push({line:0,type:'error',msg:`Brackets: ${b}`});
      if (br) issues.push({line:0,type:'error',msg:`Braces: ${br}`});
      return issues;
    }
    function validateCodeBlock(id) {
      const el = document.getElementById(id);
      const badge = document.getElementById('badge-'+id);
      const det = document.getElementById('details-'+id);
      if (!el) return;
      const code = el.textContent;
      const issues = detectLang(code)==='python' ? validatePython(code) : validateGeneric(code);
      const errs = issues.filter(i=>i.type==='error'), warns = issues.filter(i=>i.type==='warn');
      if (badge) {
        badge.textContent = errs.length ? `❌ ${errs.length}` : warns.length ? `⚠️ ${warns.length}` : '✅';
        badge.className = 'validation-badge ' + (errs.length ? 'validation-error' : warns.length ? 'validation-warn' : 'validation-pass');
      }
      if (det) {
        det.innerHTML = issues.length
          ? issues.map(i=>`<div class="${i.type==='error'?'error-line':'warn-line'}">L${i.line}: ${i.msg}</div>`).join('')
          : '<div class="ok-line">✅ No issues</div>';
        det.classList.add('show');
      }
    }
    function validateAllCodeBlocks() {
      document.querySelectorAll('[data-code-id]').forEach(b => validateCodeBlock(b.dataset.codeId));
    }
    document.getElementById('validateAllBtn').addEventListener('click', validateAllCodeBlocks);

    function openSearch() { searchContainer.classList.add('visible'); searchInput.focus(); }
    function closeSearch() {
      searchContainer.classList.remove('visible');
      searchResults.classList.remove('visible');
      searchInput.value = '';
      clearSearch();
    }
    searchToggle.addEventListener('click', () => {
      if (searchContainer.classList.contains('visible')) closeSearch(); else openSearch();
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query) performSearch(query); else clearSearch();
      } else if (e.key === 'Escape') closeSearch();
    });
    function performSearch(query) {
      searchQuery = query.toLowerCase();
      allMatches = []; currentMatchIdx = -1;
      const results = [];
      chats.forEach(chat => {
        chat.messages.forEach((msg, msgIdx) => {
          const content = msg.content;
          const lowerContent = content.toLowerCase();
          let startIdx = 0;
          while ((startIdx = lowerContent.indexOf(searchQuery, startIdx)) !== -1) {
            results.push({
              chatId: chat.id, msgIdx, startIdx,
              endIdx: startIdx + searchQuery.length,
              snippet: content.substring(Math.max(0, startIdx - 20), startIdx + searchQuery.length + 20)
            });
            startIdx += searchQuery.length;
          }
        });
      });
      renderSearchDropdown(results);
      applySearchHighlights();
    }
    function renderSearchDropdown(results) {
      searchResults.innerHTML = '';
      if (results.length === 0) {
        searchResults.innerHTML = '<div style="padding:8px;color:#888;">No matches found</div>';
        searchResults.classList.add('visible');
        return;
      }
      results.forEach((res) => {
        const chat = chats.find(c => c.id === res.chatId);
        const title = getChatTitle(chat);
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.innerHTML = `
          <div class="search-result-chat">${escapeHtml(title)}</div>
          <div class="search-result-snippet">...${escapeHtml(res.snippet)}...</div>
        `;
        item.addEventListener('click', () => {
          if (currentChatId !== res.chatId) loadChat(res.chatId);
          setTimeout(() => {
            scrollToMessage(res.chatId, res.msgIdx);
            applySearchHighlights();
            const msgMatches = allMatches.filter(m => m.chatId === res.chatId && m.msgIdx === res.msgIdx);
            if (msgMatches.length > 0) {
              currentMatchIdx = allMatches.indexOf(msgMatches[0]);
              updateCurrentHighlight();
            }
          }, 100);
          searchResults.classList.remove('visible');
        });
        searchResults.appendChild(item);
      });
      searchResults.classList.add('visible');
    }
    function scrollToMessage(chatId, msgIdx) {
      const msgEl = messagesEl.querySelector(`.msg[data-chat-id="${chatId}"][data-msg-idx="${msgIdx}"]`);
      if (msgEl) {
        msgEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        msgEl.style.transition = 'box-shadow 0.5s';
        msgEl.style.boxShadow = '0 0 15px #4a90d9';
        setTimeout(() => { msgEl.style.boxShadow = ''; }, 1500);
      }
    }
    function applySearchHighlights() {
      removeHighlights();
      if (!searchQuery) return;
      allMatches = [];
      const msgs = messagesEl.querySelectorAll('.msg');
      msgs.forEach(msgEl => {
        highlightTextInElement(msgEl, searchQuery, msgEl.dataset.chatId, parseInt(msgEl.dataset.msgIdx));
      });
      updateMatchCounter();
      if (allMatches.length > 0) {
        currentMatchIdx = 0;
        updateCurrentHighlight();
        scrollToMatch(currentMatchIdx);
      }
    }
    function highlightTextInElement(element, query, chatId, msgIdx) {
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          if (node.parentElement.tagName === 'MARK') return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach(node => {
        const text = node.textContent;
        const lowerText = text.toLowerCase();
        let idx = lowerText.indexOf(query);
        if (idx === -1) return;
        const fragment = document.createDocumentFragment();
        let lastIdx = 0;
        while (idx !== -1) {
          if (idx > lastIdx) fragment.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
          const mark = document.createElement('mark');
          mark.className = 'search-highlight';
          mark.textContent = text.substring(idx, idx + query.length);
          fragment.appendChild(mark);
          allMatches.push({ chatId, msgIdx, element: mark });
          lastIdx = idx + query.length;
          idx = lowerText.indexOf(query, lastIdx);
        }
        if (lastIdx < text.length) fragment.appendChild(document.createTextNode(text.substring(lastIdx)));
        node.parentNode.replaceChild(fragment, node);
      });
    }
    function removeHighlights() {
      const marks = messagesEl.querySelectorAll('mark.search-highlight, mark.search-current-highlight');
      marks.forEach(mark => {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
      allMatches = []; currentMatchIdx = -1; updateMatchCounter();
    }
    function clearSearch() {
      searchQuery = ''; searchInput.value = '';
      removeHighlights();
      searchResults.classList.remove('visible');
      matchCounter.textContent = '';
    }
    function updateCurrentHighlight() {
      messagesEl.querySelectorAll('mark.search-current-highlight').forEach(m => {
        m.classList.remove('search-current-highlight');
        m.classList.add('search-highlight');
      });
      if (currentMatchIdx >= 0 && currentMatchIdx < allMatches.length) {
        const currentMark = allMatches[currentMatchIdx].element;
        currentMark.classList.remove('search-highlight');
        currentMark.classList.add('search-current-highlight');
      }
      updateMatchCounter();
    }
    function updateMatchCounter() {
      if (allMatches.length === 0) matchCounter.textContent = '';
      else matchCounter.textContent = `${currentMatchIdx >= 0 ? currentMatchIdx + 1 : 0}/${allMatches.length}`;
    }
    function scrollToMatch(index) {
      if (index < 0 || index >= allMatches.length) return;
      allMatches[index].element.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    prevMatchBtn.addEventListener('click', () => {
      if (allMatches.length === 0) return;
      currentMatchIdx = (currentMatchIdx - 1 + allMatches.length) % allMatches.length;
      updateCurrentHighlight(); scrollToMatch(currentMatchIdx);
    });
    nextMatchBtn.addEventListener('click', () => {
      if (allMatches.length === 0) return;
      currentMatchIdx = (currentMatchIdx + 1) % allMatches.length;
      updateCurrentHighlight(); scrollToMatch(currentMatchIdx);
    });
    document.addEventListener('click', (e) => {
      if (!searchContainer.contains(e.target) && e.target !== searchToggle) {
        searchResults.classList.remove('visible');
      }
    });

    function stop() {
      if (controller) { controller.abort(); controller = null; }
      isProcessing = false;
      sendBtn.disabled = false; stopBtn.style.display = 'none';
      userInput.disabled = false; attachBtn.disabled = false;
    }

    async function send() {
      if (isProcessing || !apiKey) {
        if (!apiKey) alert('Please enter your API key for ' + getProvider().name);
        return;
      }
      if (!currentChatId) newChat();
      const text = userInput.value.trim();
      if (!text && !attachedFiles.length) return;

      let full = text;
      if (attachedFiles.length) {
        if (full) full += '\n\n';
        full += '--- Attached Files ---\n';
        attachedFiles.forEach(f => full += `\n### ${f.name}\n\`\`\`\n${f.content}\n\`\`\`\n`);
      }

      const chat = chats.find(c => c.id === currentChatId);
      const p = getProvider();
      chat.messages.push({ role: 'user', content: full });
      chat.updatedAt = Date.now(); await saveChats(); renderChatList();

      const userMsgDiv = createMessageElement(currentChatId, chat.messages.length - 1, 'user',
        escapeHtml(text) + (attachedFiles.length ? '<br><br>📎 '+attachedFiles.map(f=>escapeHtml(f.name)).join(', ') : '')
      );
      messagesEl.appendChild(userMsgDiv);
      scrollToBottom();
      userInput.value = ''; userInput.style.height = 'auto';
      attachedFiles = []; renderAttachedFiles();

      isProcessing = true; sendBtn.disabled = true; attachBtn.disabled = true;
      stopBtn.style.display = 'inline'; userInput.disabled = true;
      controller = new AbortController();

      try {
        const msgs = chat.messages.map(m => ({ role: m.role, content: m.content }));
        const baseBody = {
          model: modelSelect.value,
          messages: msgs,
          temperature: 1.0,
          stream: false
        };
        const requestBody = p.buildBody(baseBody, { thinking: thinkingToggle.checked });

        const res = await fetch(p.url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(requestBody),
          signal: controller.signal
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
        if (!data.choices?.[0]?.message?.content) throw new Error('Invalid response format');
        const content = data.choices[0].message.content;
        console.log(`[${p.name}] API returned model:`, data.model);
        chat.messages.push({ role: 'assistant', content });
        chat.updatedAt = Date.now(); await saveChats();

        const assistantMsgDiv = createMessageElement(currentChatId, chat.messages.length - 1, 'assistant', formatContent(content));
        messagesEl.appendChild(assistantMsgDiv);
        scrollToBottom();
        setTimeout(() => assistantMsgDiv.querySelectorAll('[data-code-id]').forEach(b => validateCodeBlock(b.dataset.codeId)), 100);
      } catch (err) {
        if (err.name !== 'AbortError') {
          const errorMsgDiv = createMessageElement(currentChatId, chat.messages.length - 1, 'assistant', '❌ ' + escapeHtml(err.message));
          messagesEl.appendChild(errorMsgDiv);
          scrollToBottom();
        }
      } finally {
        isProcessing = false; sendBtn.disabled = false; attachBtn.disabled = false;
        stopBtn.style.display = 'none'; userInput.disabled = false; controller = null;
        userInput.focus();
      }
      if (searchQuery) applySearchHighlights();
      scheduleAutoExport();
    }

    sendBtn.addEventListener('click', send);
    stopBtn.addEventListener('click', stop);
    userInput.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); send(); } });
    userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 150) + 'px'; });

    // =====================================================================
    // AUTO-EXPORT + MULTI-FOLDER SYNC
    // =====================================================================
    const AUTO_EXPORT_DELAY = 15 * 60 * 1000;
    const EXPORT_RE = /^educasa_chats_.*\.json$/i;
    const MAX_EXPORTS_PER_FOLDER = 100;

    const autoExportToggle = document.getElementById('autoExportToggle');
    const autoExportStatus = document.getElementById('autoExportStatus');
    const folderListEl     = document.getElementById('folderList');
    const connectFolderBtn = document.getElementById('connectFolderBtn');
    const syncNowBtn       = document.getElementById('syncNowBtn');
    const lastSyncInfoEl   = document.getElementById('lastSyncInfo');

    const permissionBanner     = document.getElementById('permissionBanner');
    const permissionBannerText = document.getElementById('permissionBannerText');
    const regrantBtn           = document.getElementById('regrantBtn');
    const dismissBannerBtn     = document.getElementById('dismissBannerBtn');

    let dirHandles = [];
    let autoExportTimer = null;
    let autoExportDeadline = 0;
    let autoExportEnabled = localStorage.getItem('ds_autoexport') !== 'false';
    let lastExportLabel = '';
    let lastSyncInfo = '';
    let rescanTimer = null;

    autoExportToggle.checked = autoExportEnabled;
    autoExportToggle.addEventListener('change', () => {
      autoExportEnabled = autoExportToggle.checked;
      localStorage.setItem('ds_autoexport', autoExportEnabled);
      if (!autoExportEnabled) { clearTimeout(autoExportTimer); autoExportTimer = null; }
      updateAutoExportStatus();
    });

    function buildExportName() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `educasa_chats_${MACHINE_ID}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}.json`;
    }

    function parseExportFilename(name) {
      const m = name.match(/^educasa_chats_([a-z0-9]+)_(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})\.json$/i);
      if (!m) return null;
      const [, machineId, y, mo, d, h, mi, s] = m;
      const ts = new Date(
        Number(y), Number(mo) - 1, Number(d),
        Number(h), Number(mi), Number(s)
      ).getTime();
      return { machineId, ts };
    }

    function renderLastSync(best, dir) {
      if (!best) {
        lastSyncInfoEl.textContent = '🔎 No export found in connected folders';
        return;
      }
      const parsed = parseExportFilename(best.name);
      const when = new Date(best.lastModified).toLocaleString();
      let who;
      if (!parsed) {
        who = `<span class="src">${escapeHtml(best.name)}</span>`;
      } else if (parsed.machineId === MACHINE_ID) {
        who = `<span class="own">this machine (${MACHINE_ID})</span>`;
      } else {
        who = `<span class="src">${escapeHtml(parsed.machineId)}</span>`;
      }
      const folder = dir ? escapeHtml(dir.name) : '?';
      lastSyncInfoEl.innerHTML =
        `📡 Newest: ${who} in <b>${folder}</b><br><span class="when">${when}</span>`;
    }

    function downloadJson(json, filename) {
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    async function writeExportToFolders(json, filename) {
      const written = [];
      for (const d of dirHandles) {
        try {
          if (d.handle.queryPermission) {
            const perm = await d.handle.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') continue;
          }
          const fh = await d.handle.getFileHandle(filename, { create: true });
          const w = await fh.createWritable();
          await w.write(json);
          await w.close();
          written.push(d.name);
          pruneOldExports(d.handle);
        } catch (e) {
          console.warn('Write failed for', d.name, e);
        }
      }
      return written;
    }

    async function pruneOldExports(dirHandle) {
      try {
        const files = [];
        for await (const entry of dirHandle.values()) {
          if (entry.kind !== 'file' || !EXPORT_RE.test(entry.name)) continue;
          const f = await entry.getFile();
          files.push({ name: entry.name, ts: f.lastModified });
        }
        if (files.length <= MAX_EXPORTS_PER_FOLDER) return;
        files.sort((a, b) => b.ts - a.ts);
        for (const f of files.slice(MAX_EXPORTS_PER_FOLDER)) {
          try { await dirHandle.removeEntry(f.name); } catch (e) {}
        }
      } catch (e) { /* ignore */ }
    }

    async function findNewestExportInFolder(dirHandle) {
      let newest = null;
      for await (const entry of dirHandle.values()) {
        if (entry.kind !== 'file' || !EXPORT_RE.test(entry.name)) continue;
        const file = await entry.getFile();
        if (!newest || file.lastModified > newest.lastModified) {
          newest = { name: entry.name, file, lastModified: file.lastModified };
        }
      }
      return newest;
    }

    async function scanForNewestExport({ silent = true } = {}) {
      if (!dirHandles.length) {
        if (!silent) alert('No folders connected yet. Click "📁 Add folder" first.');
        renderLastSync(null, null);
        return null;
      }
      let best = null, bestDir = null;
      for (const d of dirHandles) {
        try {
          if (d.handle.queryPermission) {
            const perm = await d.handle.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') continue;
          }
          const found = await findNewestExportInFolder(d.handle);
          if (found && (!best || found.lastModified > best.lastModified)) {
            best = found; bestDir = d;
          }
        } catch (e) { console.warn('Scan failed for', d.name, e); }
      }
      if (!best) {
        renderLastSync(null, null);
        if (!silent) alert('No educasa_chats_*.json export files found in the connected folders.');
        return null;
      }
      renderLastSync(best, bestDir);
      const applied = await applySyncFile(best, bestDir);
      return applied;
    }

    function mergeChats(localChats, incomingChats) {
      const map = new Map();
      localChats.forEach(c => map.set(c.id, c));
      let added = 0, updated = 0;
      incomingChats.forEach(inc => {
        if (!inc || !inc.id || !Array.isArray(inc.messages)) return;
        const cur = map.get(inc.id);
        if (!cur) { map.set(inc.id, inc); added++; return; }
        if ((inc.updatedAt || 0) > (cur.updatedAt || 0)) { map.set(inc.id, inc); updated++; }
      });
      return { merged: [...map.values()], added, updated };
    }

    async function applySyncFile(best, dir) {
      let parsed;
      try {
        const text = await best.file.text();
        parsed = JSON.parse(text);
      } catch (e) {
        console.warn('Could not parse export file', best.name, e);
        return false;
      }
      if (!Array.isArray(parsed)) return false;

      const { merged, added, updated } = mergeChats(chats, parsed);
      const changed = added || updated;

      if (changed) {
        // Find the newest chat from the incoming file
        let newestIncomingId = null, newestTs = 0;
        parsed.forEach(c => {
          if (!c || !c.id) return;
          const ts = c.updatedAt || 0;
          if (ts > newestTs) { newestTs = ts; newestIncomingId = c.id; }
        });

        chats = merged;
        await saveChats();
        renderChatList();

        const currentStillExists = currentChatId && chats.find(c => c.id === currentChatId);
        const currentWasUpdated  = parsed.some(p => p && p.id === currentChatId);

        if (currentStillExists) {
          loadChat(currentChatId);
        } else if (chats.length) {
          loadChat(chats[0].id);
        } else {
          newChat();
        }

        if (searchQuery) applySearchHighlights();

        const parts = [];
        if (added)   parts.push(`${added} new`);
        if (updated) parts.push(`${updated} updated`);
        const fromFolder = dir ? escapeHtml(dir.name) : '?';
        const summary = `<div class="toast-title">🔄 Synced from ${fromFolder}</div>` +
                        `${parts.join(', ')} chat(s)`;

        const newestChat = newestIncomingId ? chats.find(c => c.id === newestIncomingId) : null;
        const currentChatObj = currentChatId ? chats.find(c => c.id === currentChatId) : null;
        if (newestChat && newestChat.id !== currentChatId &&
            (newestChat.updatedAt || 0) > (currentChatObj?.updatedAt || 0)) {
          showToast(summary, {
            kind: 'success',
            duration: 12000,
            actionLabel: `Open "${escapeHtml(getChatTitle(newestChat))}"`,
            onAction: () => {
              loadChat(newestChat.id);
              scrollToBottom();
            }
          });
        } else {
          showToast(summary, { kind: 'success', duration: 4000 });
          if (currentWasUpdated) setTimeout(scrollToBottom, 60);
        }
      }

      const when = new Date(best.lastModified).toLocaleString();
      lastSyncInfo = `🔄 Synced from ${dir ? dir.name : '?'} · ${best.name} (${added} new, ${updated} updated)`;
      autoExportStatus.textContent = `🔄 Synced ${when} · +${added}/~${updated}`;
      autoExportStatus.style.color = '#4a90d9';
      return true;
    }

    function scheduleAutoExport() {
      if (!autoExportEnabled) return;
      clearTimeout(autoExportTimer);
      autoExportDeadline = Date.now() + AUTO_EXPORT_DELAY;
      autoExportTimer = setTimeout(() => {
        autoExportTimer = null;
        performAutoExport();
      }, AUTO_EXPORT_DELAY);
      updateAutoExportStatus();
    }

    async function performAutoExport() {
      clearTimeout(autoExportTimer);
      autoExportTimer = null;
      const filename = buildExportName();
      const json = JSON.stringify(chats, null, 2);
      const written = await writeExportToFolders(json, filename);
      if (!written.length) downloadJson(json, filename);
      const stamp = new Date().toLocaleTimeString();
      lastExportLabel = written.length
        ? `💾 Auto-exported to ${written.join(', ')} at ${stamp}`
        : `💾 Auto-export downloaded at ${stamp} (no folder connected)`;
      updateAutoExportStatus();
    }

    function updateAutoExportStatus() {
      if (!autoExportEnabled) {
        syncPanelDot.style.background = '#666';
        syncPanelDot.style.boxShadow = 'none';
        syncPanelDot.style.animation = 'none';
      } else if (autoExportTimer) {
        syncPanelDot.style.background = '#ff9800';
        syncPanelDot.style.boxShadow = '0 0 6px rgba(255,152,0,0.6)';
        syncPanelDot.style.animation = 'pulseDot 2s ease-in-out infinite';
      } else {
        syncPanelDot.style.background = '#4caf50';
        syncPanelDot.style.boxShadow = '0 0 6px rgba(76,175,80,0.6)';
        syncPanelDot.style.animation = 'pulseDot 2s ease-in-out infinite';
      }

      if (!autoExportEnabled) {
        autoExportStatus.textContent = '⏱ Auto-export: off';
        autoExportStatus.style.color = '#7a7a8a';
        return;
      }
      if (!autoExportTimer) {
        autoExportStatus.textContent = lastExportLabel || lastSyncInfo || '⏱ Auto-export: armed on next inquiry';
        autoExportStatus.style.color = lastExportLabel ? '#4caf50' : '#7a7a8a';
        return;
      }
      const left = Math.max(0, autoExportDeadline - Date.now());
      const m = Math.floor(left / 60000);
      const s = Math.floor((left % 60000) / 1000);
      autoExportStatus.textContent = `⏱ Auto-export in ${m}:${String(s).padStart(2, '0')}`;
      autoExportStatus.style.color = '#ff9800';
    }
    setInterval(() => { if (autoExportTimer) updateAutoExportStatus(); }, 1000);

    function startPeriodicRescan() {
      if (rescanTimer) clearInterval(rescanTimer);
      rescanTimer = setInterval(async () => {
        if (!dirHandles.length) return;
        if (document.visibilityState !== 'visible') return;
        try { await scanForNewestExport({ silent: true }); } catch (e) {}
      }, 2 * 60 * 1000);
    }

    async function checkFolderPermissions() {
      const needRegrant = [];
      for (const d of dirHandles) {
        if (!d.handle.queryPermission) continue;
        try {
          const p = await d.handle.queryPermission({ mode: 'readwrite' });
          if (p !== 'granted') needRegrant.push(d);
        } catch (e) { needRegrant.push(d); }
      }
      return needRegrant;
    }

    async function showPermissionBannerIfNeeded() {
      const need = await checkFolderPermissions();
      if (!need.length) {
        permissionBanner.classList.remove('show');
        return;
      }
      const names = need.map(d => d.name).join(', ');
      permissionBannerText.textContent = `🔒 ${need.length} folder(s) need permission: ${names}`;
      permissionBanner.classList.add('show');
    }

    async function regrantAllFolders() {
      for (const d of dirHandles) {
        try {
          if (d.handle.requestPermission) {
            await d.handle.requestPermission({ mode: 'readwrite' });
          }
        } catch (e) { console.warn('Regrant failed for', d.name, e); }
      }
      await renderFolderList();
      await showPermissionBannerIfNeeded();
      try { await scanForNewestExport({ silent: true }); } catch (e) {}
    }

    regrantBtn.addEventListener('click', regrantAllFolders);
    dismissBannerBtn.addEventListener('click', () => permissionBanner.classList.remove('show'));

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') showPermissionBannerIfNeeded();
    });

    const FS_SUPPORTED = (typeof window.showDirectoryPicker === 'function');

    async function connectFolder() {
      if (!FS_SUPPORTED) {
        alert('Your browser does not support direct folder access.\n\n' +
              'Use Chrome or Edge over https:// (or open this file locally in Chrome).\n' +
              'Without it, auto-export will simply download the JSON file to your default Downloads folder.');
        return;
      }
      try {
        const handle = await window.showDirectoryPicker({ id: 'educasa-sync', mode: 'readwrite' });
        let perm = 'granted';
        if (handle.requestPermission) perm = await handle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') { alert('Permission denied for that folder.'); return; }
        if (dirHandles.some(d => d.name === handle.name)) { alert('That folder is already connected.'); return; }
        dirHandles.push({ id: 'dir_' + Date.now(), name: handle.name, handle });
        await saveHandlesToDB(dirHandles);
        await renderFolderList();
        await showPermissionBannerIfNeeded();
        await scanForNewestExport({ silent: true });
      } catch (e) {
        if (e.name !== 'AbortError') alert('Could not connect folder: ' + e.message);
      }
    }

    async function requestFolderPermission(d) {
      try {
        if (!d.handle.requestPermission) return;
        const perm = await d.handle.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          await showPermissionBannerIfNeeded();
          await scanForNewestExport({ silent: true });
        }
      } catch (e) { console.warn(e); }
    }

    async function renderFolderList() {
      folderListEl.innerHTML = '';
      if (!dirHandles.length) {
        folderListEl.innerHTML = '<div style="font-size:11px;color:#666;padding:2px 0;">No folders connected — export will be downloaded instead.</div>';
        return;
      }
      for (const d of dirHandles) {
        let icon = '❔';
        try {
          if (d.handle.queryPermission) {
            const p = await d.handle.queryPermission({ mode: 'readwrite' });
            icon = p === 'granted' ? '✅' : '🔒';
          } else icon = '✅';
        } catch (e) { icon = '⚠️'; }

        const row = document.createElement('div');
        row.className = 'folder-item';

        const name = document.createElement('span');
        name.className = 'fname';
        name.textContent = d.name;
        name.title = d.name;

        const state = document.createElement('span');
        state.className = 'fstate';
        state.textContent = icon;
        state.title = icon === '🔒' ? 'Click to grant access' : 'Access granted';
        state.addEventListener('click', async () => { await requestFolderPermission(d); renderFolderList(); });

        const del = document.createElement('span');
        del.className = 'fdel';
        del.textContent = '✕';
        del.title = 'Disconnect this folder';
        del.addEventListener('click', async () => {
          dirHandles = dirHandles.filter(x => x.id !== d.id);
          await saveHandlesToDB(dirHandles);
          renderFolderList();
          showPermissionBannerIfNeeded();
        });

        row.appendChild(name);
        row.appendChild(state);
        row.appendChild(del);
        folderListEl.appendChild(row);
      }
    }

    connectFolderBtn.addEventListener('click', connectFolder);

    syncNowBtn.addEventListener('click', async () => {
      const filename = buildExportName();
      const json = JSON.stringify(chats, null, 2);
      const written = await writeExportToFolders(json, filename);
      if (!written.length) downloadJson(json, filename);
      await scanForNewestExport({ silent: false });
      lastExportLabel = written.length
        ? `💾 Exported to ${written.join(', ')} at ${new Date().toLocaleTimeString()}`
        : `💾 Downloaded export at ${new Date().toLocaleTimeString()}`;
      updateAutoExportStatus();
    });

    document.getElementById('exportChatsBtn').addEventListener('click', async () => {
      const filename = buildExportName();
      const json = JSON.stringify(chats, null, 2);
      const written = await writeExportToFolders(json, filename);
      if (!written.length) downloadJson(json, filename);
      lastExportLabel = written.length
        ? `💾 Exported to ${written.join(', ')} at ${new Date().toLocaleTimeString()}`
        : `💾 Downloaded export at ${new Date().toLocaleTimeString()}`;
      updateAutoExportStatus();
    });

    document.getElementById('importChatsBtn').addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json';
      inp.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (!Array.isArray(imported)) throw new Error('Invalid format');
            imported.forEach(c => { if (!c.id || !Array.isArray(c.messages)) throw new Error('Corrupted data'); });
            if (confirm(`Replace with ${imported.length} chat(s)?`)) {
              chats = imported;
              await saveChats();
              currentChatId = chats.length ? chats[0].id : null;
              currentChatId ? loadChat(currentChatId) : (messagesEl.innerHTML = '', newChat());
              renderChatList();
              scheduleAutoExport();
            }
          } catch (err) { alert('Import failed: ' + err.message); }
        };
        reader.readAsText(file);
      };
      inp.click();
    });

    async function initApp() {
      try { chats = await loadChatsFromDB(); }
      catch (e) { alert('Failed to load chats from storage: ' + e.message); chats = []; }

      thinkingToggle.checked = localStorage.getItem('ds_thinking') === 'true';

      providerSelect.value = provider;
      populateModels();
      loadApiKeyForProvider();
      updateStatus();

      try {
        dirHandles = await loadHandlesFromDB();
      } catch (e) { console.warn('Could not restore folder handles', e); dirHandles = []; }
      await renderFolderList();

      if (!chats.length) newChat();
      else loadChat(chats[0].id);
      renderChatList();

      if (window.innerWidth <= 600) {
        sidebar.classList.remove('visible');
        mainEl.classList.add('full-width');
      }
      if (currentChatId) setTimeout(validateAllCodeBlocks, 600);

      if (dirHandles.length) {
        try { await scanForNewestExport({ silent: true }); }
        catch (e) { console.warn('Startup sync failed', e); }
      }

      await showPermissionBannerIfNeeded();
      startPeriodicRescan();
      updateAutoExportStatus();

      if (!FS_SUPPORTED) {
        autoExportStatus.textContent = '⚠️ Folder sync unsupported in this browser — auto-export will download files.';
        autoExportStatus.style.color = '#ff9800';
        connectFolderBtn.title = 'Not supported in this browser';
      }
    }

    initApp();
  })();
</script>
</body>
</html>
