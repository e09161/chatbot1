<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            padding: 12px 20px;
            background: #0d0d0d;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #header input {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            width: 280px;
        }
        #header button {
            padding: 8px 16px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        #header button:hover { background: #357abd; }
        #status { font-size: 12px; margin-left: auto; }
        #status.ready { color: #4caf50; }
        #status.no-key { color: #f44336; }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .msg {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            max-width: 85%;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.6;
        }
        .user {
            background: #16213e;
            margin-left: auto;
        }
        .assistant {
            background: #0f3460;
            margin-right: auto;
        }
        
        .code-block {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        .code-header {
            background: #222;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }
        .code-header button {
            background: #333;
            color: #ccc;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 5px;
        }
        .code-header button:hover { background: #444; }
        .code-content {
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            color: #a8d8a8;
        }
        
        #input-area {
            padding: 15px 20px;
            background: #0d0d0d;
            display: flex;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        #userInput:focus { border-color: #4a90d9; }
        #sendBtn {
            padding: 12px 20px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #sendBtn:hover { background: #357abd; }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #stopBtn {
            padding: 12px 20px;
            background: #d94a4a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #stopBtn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div id="header">
        <span style="color:#888;">API Key:</span>
        <input type="password" id="apiKey" placeholder="sk-...">
        <button onclick="saveKey()">Save</button>
        <button onclick="newChat()" style="background:#555;">New Chat</button>
        <span id="status" class="no-key">Set API key</span>
    </div>
    
    <div id="messages"></div>
    
    <div id="input-area">
        <textarea id="userInput" rows="1" placeholder="Ask anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
        <button id="sendBtn" onclick="send()">Send</button>
        <button id="stopBtn" onclick="stop()" style="display:none;">Stop</button>
    </div>

    <script>
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';
        let apiKey = localStorage.getItem('ds_key') || '';
        let messages = [];
        let isProcessing = false;
        let controller = null;

        document.getElementById('apiKey').value = apiKey;
        updateStatus();

        function saveKey() {
            apiKey = document.getElementById('apiKey').value.trim();
            localStorage.setItem('ds_key', apiKey);
            updateStatus();
        }

        function updateStatus() {
            const status = document.getElementById('status');
            if (apiKey) {
                status.textContent = 'Ready';
                status.className = 'ready';
            } else {
                status.textContent = 'Set API key';
                status.className = 'no-key';
            }
        }

        function newChat() {
            messages = [];
            document.getElementById('messages').innerHTML = '';
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // The SIMPLEST formatter - only handles ``` blocks
        function formatContent(content) {
            if (!content) return '';
            
            // Split by ``` and alternate between text and code
            const parts = content.split('```');
            let html = '';
            
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    // Even indices are text
                    if (parts[i].trim()) {
                        html += escapeHtml(parts[i]).replace(/\n/g, '<br>');
                    }
                } else {
                    // Odd indices are code
                    const code = parts[i];
                    const newlineIdx = code.indexOf('\n');
                    const lang = newlineIdx > -1 ? code.substring(0, newlineIdx).trim() : '';
                    const content = newlineIdx > -1 ? code.substring(newlineIdx + 1) : code;
                    const id = 'c' + Math.random().toString(36).substr(2, 8);
                    const ext = lang === 'python' ? 'py' : lang === 'xml' ? 'xml' : lang === 'html' ? 'html' : 'txt';
                    
                    html += `
                        <div class="code-block">
                            <div class="code-header">
                                <span>${escapeHtml(lang || 'code')}</span>
                                <span>
                                    <button onclick="copyCode('${id}')">Copy</button>
                                    <button onclick="downloadCode('${id}','${ext}')">Download</button>
                                </span>
                            </div>
                            <div class="code-content"><code id="${id}">${escapeHtml(content.trim())}</code></div>
                        </div>`;
                }
            }
            
            return html;
        }

        function copyCode(id) {
            const el = document.getElementById(id);
            if (el) navigator.clipboard.writeText(el.textContent);
        }

        function downloadCode(id, ext) {
            const el = document.getElementById(id);
            if (el) {
                const blob = new Blob([el.textContent], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `code.${ext}`;
                a.click();
            }
        }

        function addMessage(role, content) {
            messages.push({ role, content });
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = formatContent(content);
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        function stop() {
            if (controller) {
                controller.abort();
                controller = null;
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('stopBtn').style.display = 'none';
                document.getElementById('sendBtn').style.display = 'inline';
                document.getElementById('userInput').disabled = false;
            }
        }

        async function send() {
            if (isProcessing || !apiKey) return;
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            
            isProcessing = true;
            document.getElementById('sendBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline';
            document.getElementById('userInput').disabled = true;
            
            controller = new AbortController();
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: messages,
                        stream: false
                    }),
                    signal: controller.signal
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || `Error ${response.status}`);
                }
                
                addMessage('assistant', data.choices[0].message.content);
                
            } catch (err) {
                if (err.name !== 'AbortError') {
                    addMessage('assistant', 'Error: ' + err.message);
                }
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('sendBtn').style.display = 'inline';
                document.getElementById('stopBtn').style.display = 'none';
                document.getElementById('userInput').disabled = false;
                controller = null;
                input.focus();
            }
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
