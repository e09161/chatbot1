<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat · sync & drag</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
        }
        #sidebar {
            width: 260px; min-width: 260px;
            background: #0d0d0d;
            display: flex; flex-direction: column;
            border-right: 1px solid #222;
        }
        #sidebar-header {
            padding: 20px 15px; border-bottom: 1px solid #222;
            font-weight: bold; font-size: 18px;
            display: flex; justify-content: space-between;
        }
        #sidebar-header button {
            background: #2a2a3e; border: none; color: #ccc;
            padding: 2px 10px; border-radius: 12px; cursor: pointer; font-size: 12px;
        }
        #sidebar-header button:hover { background: #4a4a6e; }
        #new-chat-btn {
            margin: 15px; padding: 10px;
            background: #1a1a2e; border: 1px solid #333;
            border-radius: 8px; color: #e0e0e0;
            cursor: pointer; text-align: center; font-size: 14px;
        }
        #new-chat-btn:hover { background: #222; }
        #chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item {
            padding: 12px; margin: 4px 0; border-radius: 8px;
            cursor: pointer; font-size: 13px; color: #999;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-item:hover { background: #1a1a2e; color: #e0e0e0; }
        .chat-item.active { background: #1a1a2e; border: 1px solid #4a90d9; color: #e0e0e0; }
        .chat-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item-delete { color: #666; margin-left: 8px; cursor: pointer; }
        .chat-item-delete:hover { color: #f44; }
        #sidebar-footer { 
            padding: 12px 15px; border-top: 1px solid #222; font-size: 12px; color: #888;
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        #sidebar-footer button {
            background: #2a2a3e; border: none; color: #bbb; padding: 4px 10px;
            border-radius: 16px; cursor: pointer; font-size: 11px;
        }
        #sidebar-footer button:hover { background: #3a3a5e; }
        
        #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #header {
            padding: 12px 20px; background: #0d0d0d;
            display: flex; gap: 10px; align-items: center;
            border-bottom: 1px solid #222;
        }
        #header input {
            background: #1a1a2e; border: 1px solid #333;
            color: #e0e0e0; padding: 8px 12px;
            border-radius: 6px; font-size: 13px; width: 220px;
        }
        #header button {
            padding: 8px 16px; background: #4a90d9;
            color: white; border: none; border-radius: 6px;
            cursor: pointer; font-size: 13px;
        }
        #header button:hover { background: #357abd; }
        #status { font-size: 12px; margin-left: auto; }
        
        #messages {
            flex: 1; overflow-y: auto; padding: 20px;
            max-width: 850px; margin: 0 auto; width: 100%;
        }
        .msg {
            margin-bottom: 20px; padding: 15px; border-radius: 10px;
            max-width: 85%; white-space: pre-wrap; word-break: break-word;
            font-size: 14px; line-height: 1.6;
        }
        .user { background: #16213e; margin-left: auto; }
        .assistant { background: #0f3460; margin-right: auto; }
        
        .code-block {
            background: #0d0d0d; border: 1px solid #333;
            border-radius: 8px; margin: 10px 0; overflow: hidden;
            position: relative;
        }
        .code-header {
            background: #222; padding: 8px 15px;
            display: flex; justify-content: space-between;
            align-items: center; font-size: 12px; color: #888;
        }
        .code-header button {
            background: #333; color: #ccc; border: none;
            padding: 4px 10px; border-radius: 4px;
            cursor: pointer; font-size: 11px; margin-left: 5px;
        }
        .code-header button:hover { background: #444; }
        .code-content {
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px; line-height: 1.5;
            white-space: pre-wrap; word-break: break-word;
            overflow-x: auto; color: #a8d8a8;
        }
        
        .validation-badge {
            display: inline-block; padding: 2px 8px;
            border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: 8px;
        }
        .validation-pass { background: #1b5e20; color: #4caf50; }
        .validation-warn { background: #e65100; color: #ff9800; }
        .validation-error { background: #b71c1c; color: #f44336; }
        .validation-details {
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 6px; padding: 10px; margin-top: 8px;
            font-size: 12px; font-family: 'Courier New', monospace; display: none;
        }
        .validation-details.show { display: block; }
        .validation-details .error-line { color: #f44336; }
        .validation-details .warn-line { color: #ff9800; }
        .validation-details .ok-line { color: #4caf50; }
        
        #input-area {
            padding: 15px 20px; background: #0d0d0d;
            display: flex; flex-direction: column; gap: 8px;
            max-width: 850px; margin: 0 auto; width: 100%;
            border-top: 1px solid #222;
        }
        #input-area.drag-over {
            background: #1a1a3e;
            border-top: 2px dashed #4a90d9;
        }
        .attached-files {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .attached-file {
            background: #1a1a2e; border: 1px solid #333;
            border-radius: 16px; padding: 4px 12px;
            font-size: 12px; display: flex; align-items: center; gap: 6px;
            color: #ccc;
        }
        .attached-file .remove-file {
            cursor: pointer; color: #888; font-weight: bold;
        }
        .attached-file .remove-file:hover { color: #f44; }
        .input-row {
            display: flex; gap: 10px;
        }
        #userInput {
            flex: 1; padding: 12px;
            border: 1px solid #333; border-radius: 8px;
            background: #1a1a2e; color: #e0e0e0;
            font-family: inherit; font-size: 14px;
            resize: none; outline: none;
        }
        #userInput:focus { border-color: #4a90d9; }
        #sendBtn, #stopBtn, #attachBtn {
            padding: 12px 16px; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-size: 14px;
        }
        #sendBtn { background: #4a90d9; }
        #sendBtn:hover { background: #357abd; }
        #sendBtn:disabled { opacity: 0.5; }
        #stopBtn { background: #d94a4a; }
        #stopBtn:hover { background: #c0392b; }
        #attachBtn { background: #555; }
        #attachBtn:hover { background: #666; }
        #validateAllBtn {
            padding: 8px 14px; background: #ff9800;
            color: white; border: none; border-radius: 6px;
            cursor: pointer; font-size: 12px;
        }
        #validateAllBtn:hover { background: #f57c00; }
        .drag-hint {
            font-size: 11px; color: #666; text-align: center;
        }
        .sync-badge { font-size: 10px; opacity: 0.7; margin-left: 6px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            💬 Chats
            <button onclick="exportChats()" title="Export chat history (JSON)">⬆️</button>
            <button onclick="document.getElementById('importInput').click()" title="Import chat history (JSON)">⬇️</button>
        </div>
        <div id="new-chat-btn" onclick="newChat()">+ New Chat</div>
        <div id="chat-list"></div>
        <div id="sidebar-footer" id="sidebarStatus">
            <span id="syncInfo">💾 sync ready</span>
        </div>
    </div>
    <!-- hidden import input -->
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importChats(event)">
    
    <div id="main">
        <div id="header">
            <span style="color:#888;">API Key:</span>
            <input type="password" id="apiKey" placeholder="sk-...">
            <button onclick="saveKey()">Save</button>
            <button id="validateAllBtn" onclick="validateAllCodeBlocks()">🔍 Validate Code</button>
            <span id="status"></span>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-area">
            <div class="attached-files" id="attachedFiles"></div>
            <div class="input-row">
                <textarea id="userInput" rows="1" placeholder="Ask for code... Drag & drop files here"
                          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
                <button id="attachBtn" onclick="document.getElementById('fileInput').click()">📎</button>
                <button id="sendBtn" onclick="send()">Send</button>
                <button id="stopBtn" onclick="stop()" style="display:none;">Stop</button>
            </div>
            <div class="drag-hint">Drop .py .xml .txt .html .js .css .json .md .csv</div>
        </div>
    </div>
    
    <input type="file" id="fileInput" multiple accept=".py,.xml,.txt,.html,.js,.css,.json,.md,.csv" style="display:none;" onchange="handleFileSelect(event)">

    <script>
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';
        const MAX_TOKENS = 8192;
        
        let apiKey = localStorage.getItem('ds_key') || '';
        let chats = JSON.parse(localStorage.getItem('ds_chats') || '[]');
        let currentChatId = null;
        let isProcessing = false;
        let controller = null;
        let attachedFiles = []; // Current attachment list

        document.getElementById('apiKey').value = apiKey;
        updateStatus();
        renderChatList();
        if (!chats.length) newChat();
        else loadChat(chats[0].id);

        // ============ DRAG & DROP (global drop on input-area) ============
        const inputArea = document.getElementById('input-area');
        
        // prevent default for whole document
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });
        
        // visual feedback
        ['dragenter', 'dragover'].forEach(eventName => {
            inputArea.addEventListener(eventName, () => {
                inputArea.classList.add('drag-over');
            });
        });
        ['dragleave', 'drop'].forEach(eventName => {
            inputArea.addEventListener(eventName, () => {
                inputArea.classList.remove('drag-over');
            });
        });
        
        // DROP handler
        inputArea.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files);
            if (files.length > 0) processFiles(files);
        });

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            if (files.length > 0) processFiles(files);
            event.target.value = ''; 
        }

        function processFiles(files) {
            files.forEach(file => {
                const allowedExtensions = ['.py', '.xml', '.txt', '.html', '.js', '.css', '.json', '.md', '.csv'];
                const ext = '.' + file.name.split('.').pop().toLowerCase();
                
                if (!allowedExtensions.includes(ext)) {
                    alert(`File type "${ext}" not supported. Allowed: ${allowedExtensions.join(', ')}`);
                    return;
                }
                if (file.size > 1024 * 1024) {
                    alert(`File "${file.name}" is too large. Max size: 1MB`);
                    return;
                }
                if (attachedFiles.find(f => f.name === file.name)) {
                    alert(`File "${file.name}" is already attached.`);
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    attachedFiles.push({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        content: e.target.result,
                        icon: getFileIcon(file.name)
                    });
                    renderAttachedFiles();
                };
                reader.onerror = () => {
                    alert(`Failed to read file: ${file.name}`);
                };
                reader.readAsText(file);
            });
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                py: '🐍', xml: '📰', txt: '📄', html: '🌐',
                js: '📜', css: '🎨', json: '📋', md: '📘', csv: '📊'
            };
            return icons[ext] || '📎';
        }

        function renderAttachedFiles() {
            const container = document.getElementById('attachedFiles');
            container.innerHTML = '';
            attachedFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'attached-file';
                div.innerHTML = `
                    ${file.icon} ${file.name} (${(file.size / 1024).toFixed(1)}KB)
                    <span class="remove-file" onclick="removeFile(${index})">×</span>`;
                container.appendChild(div);
            });
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            renderAttachedFiles();
        }

        // ============ API KEY ============
        function saveKey() {
            apiKey = document.getElementById('apiKey').value.trim();
            localStorage.setItem('ds_key', apiKey);
            updateStatus();
        }

        function updateStatus() {
            const s = document.getElementById('status');
            const ss = document.getElementById('sidebarStatus');
            if (apiKey) {
                s.textContent = '✅ Ready · 8192 tokens';
                s.style.color = '#4caf50';
                ss.innerHTML = `<span style="color:#4caf50;">✅ API ready</span>`;
            } else {
                s.textContent = '❌ Set API key';
                s.style.color = '#f44';
                ss.innerHTML = `<span style="color:#f44;">❌ No API key</span>`;
            }
        }

        // ============ CHAT HISTORY ============
        function saveChats() { localStorage.setItem('ds_chats', JSON.stringify(chats)); }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            chats.sort((a, b) => b.updatedAt - a.updatedAt);
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
                div.onclick = () => loadChat(chat.id);
                const title = chat.messages.find(m => m.role === 'user')?.content?.substring(0, 30) || 'New Chat';
                div.innerHTML = `<span class="chat-item-title">${title.replace(/</g,'&lt;')}</span>
                    <span class="chat-item-delete" onclick="event.stopPropagation();deleteChat('${chat.id}')">×</span>`;
                list.appendChild(div);
            });
        }

        function newChat() {
            currentChatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            chats.push({ id: currentChatId, messages: [], createdAt: Date.now(), updatedAt: Date.now() });
            saveChats(); renderChatList();
            document.getElementById('messages').innerHTML = '';
            attachedFiles = [];
            renderAttachedFiles();
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            document.getElementById('messages').innerHTML = '';
            attachedFiles = [];
            renderAttachedFiles();
            if (chat?.messages) {
                chat.messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.role}`;
                    div.innerHTML = formatContent(m.content);
                    document.getElementById('messages').appendChild(div);
                });
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                setTimeout(validateAllCodeBlocks, 500);
            }
            renderChatList();
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) { currentChatId = null; document.getElementById('messages').innerHTML = ''; }
            if (!chats.length) newChat();
            else if (!currentChatId) loadChat(chats[0].id);
            saveChats(); renderChatList();
        }

        // ============ EXPORT / IMPORT (sync) ============
        function exportChats() {
            if (!chats.length) { alert('No chats to export.'); return; }
            const data = JSON.stringify({ version: 1, exportedAt: Date.now(), chats: chats }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            const d = new Date();
            const suffix = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
            a.download = `deepseek_chats_${suffix}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importChats(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!parsed.chats || !Array.isArray(parsed.chats)) {
                        alert('Invalid format: missing "chats" array.');
                        return;
                    }
                    // merge: replace existing chats with same id, add new ones
                    const existingIds = new Set(chats.map(c => c.id));
                    parsed.chats.forEach(imported => {
                        if (existingIds.has(imported.id)) {
                            // overwrite existing
                            const idx = chats.findIndex(c => c.id === imported.id);
                            if (idx !== -1) chats[idx] = imported;
                        } else {
                            chats.push(imported);
                        }
                    });
                    saveChats();
                    renderChatList();
                    if (chats.length > 0) loadChat(chats[0].id);
                    alert(`Imported ${parsed.chats.length} chat(s) successfully.`);
                } catch (err) {
                    alert('Failed to parse JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // reset
        }

        // ============ FORMATTING ============
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function formatContent(content) {
            if (!content) return '';
            const parts = content.split('');
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    if (parts[i].trim()) html += escapeHtml(parts[i]).replace(/\n/g, '<br>');
                } else {
                    const code = parts[i];
                    const nl = code.indexOf('\n');
                    const lang = nl > -1 ? code.substring(0, nl).trim() : 'code';
                    const codeContent = nl > -1 ? code.substring(nl + 1) : code;
                    const id = 'c' + Math.random().toString(36).substr(2, 10);
                    const ext = lang === 'python' ? 'py' : lang === 'xml' ? 'xml' : lang === 'html' ? 'html' : 'txt';
                    
                    html += `
                        <div class="code-block" data-code-id="${id}">
                            <div class="code-header">
                                <span>${escapeHtml(lang)} <span class="validation-badge" id="badge-${id}"></span></span>
                                <span>
                                    <button onclick="copyCode('${id}')">Copy</button>
                                    <button onclick="downloadCode('${id}','${ext}')">Download</button>
                                    <button onclick="validateCodeBlock('${id}')" style="background:#ff9800;">🔍 Check</button>
                                </span>
                            </div>
                            <div class="code-content"><code id="${id}">${escapeHtml(codeContent.trim())}</code></div>
                            <div class="validation-details" id="details-${id}"></div>
                        </div>`;
                }
            }
            return html;
        }

        function copyCode(id) {
            const el = document.getElementById(id);
            if (el) navigator.clipboard.writeText(el.textContent);
        }

        function downloadCode(id, ext) {
            const el = document.getElementById(id);
            if (el) {
                const blob = new Blob([el.textContent], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                // unique filename: timestamp + random suffix
                const timestamp = Date.now().toString(36);
                const random = Math.random().toString(36).substr(2, 6);
                a.download = `code_${timestamp}_${random}.${ext}`;
                a.click();
                URL.revokeObjectURL(a.href);
            }
        }

        // ============ VALIDATOR ============
        function validatePython(code) {
            const issues = [];
            let parenCount = 0, bracketCount = 0, braceCount = 0;
            code.split('\n').forEach((line, i) => {
                for (const ch of line) {
                    if (ch === '(') parenCount++;
                    if (ch === ')') parenCount--;
                    if (ch === '[') bracketCount++;
                    if (ch === ']') bracketCount--;
                    if (ch === '{') braceCount++;
                    if (ch === '}') braceCount--;
                }
            });
            if (parenCount !== 0) issues.push({ line: 0, type: 'error', msg: `Unbalanced parentheses (${parenCount > 0 ? '+' : ''}${parenCount})` });
            if (bracketCount !== 0) issues.push({ line: 0, type: 'error', msg: `Unbalanced brackets (${bracketCount > 0 ? '+' : ''}${bracketCount})` });
            if (braceCount !== 0) issues.push({ line: 0, type: 'warn', msg: `Unbalanced braces (${braceCount > 0 ? '+' : ''}${braceCount}) - might be f-strings` });
            const lastLine = code.split('\n').pop()?.trim();
            if (lastLine && (lastLine.endsWith('=') || lastLine.endsWith('(') || lastLine.endsWith(',') || lastLine.endsWith('\\'))) {
                issues.push({ line: code.split('\n').length, type: 'warn', msg: 'Code appears truncated' });
            }
            return issues;
        }

        function validateGeneric(code) {
            const issues = [];
            const parens = (code.match(/\(/g) || []).length - (code.match(/\)/g) || []).length;
            const braces = (code.match(/\{/g) || []).length - (code.match(/\}/g) || []).length;
            const brackets = (code.match(/\[/g) || []).length - (code.match(/\]/g) || []).length;
            if (parens !== 0) issues.push({ line: 0, type: 'error', msg: `Unbalanced parentheses: ${parens}` });
            if (braces !== 0) issues.push({ line: 0, type: 'error', msg: `Unbalanced braces: ${braces}` });
            if (brackets !== 0) issues.push({ line: 0, type: 'error', msg: `Unbalanced brackets: ${brackets}` });
            return issues;
        }

        function detectLanguage(code) {
            if (/^(import |from |def |class )/m.test(code)) return 'python';
            if (/^<\?xml|<manifest|<questestinterop/i.test(code)) return 'xml';
            if (/^(const |let |var |function )/m.test(code)) return 'javascript';
            return 'text';
        }

        function validateCodeBlock(id) {
            const codeEl = document.getElementById(id);
            const detailsEl = document.getElementById('details-' + id);
            const badgeEl = document.getElementById('badge-' + id);
            if (!codeEl) return;
            const code = codeEl.textContent;
            const lang = detectLanguage(code);
            let issues = lang === 'python' ? validatePython(code) : validateGeneric(code);
            const errors = issues.filter(i => i.type === 'error');
            const warns = issues.filter(i => i.type === 'warn');
            if (errors.length > 0) {
                badgeEl.textContent = `❌ ${errors.length} error${errors.length > 1 ? 's' : ''}`;
                badgeEl.className = 'validation-badge validation-error';
            } else if (warns.length > 0) {
                badgeEl.textContent = `⚠️ ${warns.length} warning${warns.length > 1 ? 's' : ''}`;
                badgeEl.className = 'validation-badge validation-warn';
            } else {
                badgeEl.textContent = '✅ Valid';
                badgeEl.className = 'validation-badge validation-pass';
            }
            if (issues.length > 0) {
                detailsEl.innerHTML = issues.map(i => 
                    `<div class="${i.type === 'error' ? 'error-line' : 'warn-line'}">Line ${i.line}: ${i.msg}</div>`
                ).join('');
                detailsEl.classList.add('show');
            } else {
                detailsEl.innerHTML = '<div class="ok-line">✅ No issues found</div>';
                detailsEl.classList.add('show');
            }
        }

        function validateAllCodeBlocks() {
            const blocks = document.querySelectorAll('[data-code-id]');
            blocks.forEach(block => validateCodeBlock(block.getAttribute('data-code-id')));
            const total = blocks.length;
            const errors = document.querySelectorAll('.validation-error').length;
            const warns = document.querySelectorAll('.validation-warn').length;
            if (total === 0) alert('No code blocks found to validate.');
            else if (errors === 0 && warns === 0) alert(`✅ All ${total} code block(s) passed validation!`);
            else alert(`🔍 Validated ${total} code block(s): ${errors} error(s), ${warns} warning(s)`);
        }

        // ============ MESSAGES ============
        function stop() {
            if (controller) { controller.abort(); controller = null; }
            isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('userInput').disabled = false;
            document.getElementById('attachBtn').disabled = false;
        }

        async function send() {
            if (isProcessing || !apiKey) return;
            if (!currentChatId) newChat();
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text && attachedFiles.length === 0) return;
            
            // Build message with file contents
            let fullMessage = text;
            if (attachedFiles.length > 0) {
                if (fullMessage) fullMessage += '\n\n';
                fullMessage += '--- Attached Files ---\n';
                attachedFiles.forEach(file => {
                    fullMessage += `\n### File: ${file.name}\n\`\`\`\n${file.content}\n\`\`\`\n`;
                });
            }
            
            const chat = chats.find(c => c.id === currentChatId);
            const userMsg = {
                role: 'user',
                content: fullMessage,
                files: attachedFiles.map(f => ({ name: f.name, type: f.type, size: f.size }))
            };
            chat.messages.push(userMsg);
            chat.updatedAt = Date.now();
            saveChats(); renderChatList();
            
            const div = document.createElement('div');
            div.className = 'msg user';
            if (attachedFiles.length > 0) {
                div.innerHTML = escapeHtml(text) + 
                    '<br><br>📎 <em>' + attachedFiles.map(f => f.name).join(', ') + '</em>';
            } else {
                div.textContent = text;
            }
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            
            input.value = ''; input.style.height = 'auto';
            attachedFiles = [];
            renderAttachedFiles();
            
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('attachBtn').disabled = true;
            document.getElementById('stopBtn').style.display = 'inline';
            document.getElementById('userInput').disabled = true;
            controller = new AbortController();
            
            try {
                const apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content }));
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: apiMessages,
                        max_tokens: MAX_TOKENS,
                        stream: false
                    }),
                    signal: controller.signal
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || `Error ${response.status}`);
                
                const content = data.choices[0].message.content;
                chat.messages.push({ role: 'assistant', content });
                chat.updatedAt = Date.now();
                saveChats();
                
                const adiv = document.createElement('div');
                adiv.className = 'msg assistant';
                adiv.innerHTML = formatContent(content);
                document.getElementById('messages').appendChild(adiv);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                
                setTimeout(() => {
                    adiv.querySelectorAll('[data-code-id]').forEach(block => {
                        validateCodeBlock(block.getAttribute('data-code-id'));
                    });
                }, 100);
                
            } catch (err) {
                if (err.name !== 'AbortError') {
                    const ediv = document.createElement('div');
                    ediv.className = 'msg assistant';
                    ediv.textContent = 'Error: ' + err.message;
                    document.getElementById('messages').appendChild(ediv);
                }
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('attachBtn').disabled = false;
                document.getElementById('stopBtn').style.display = 'none';
                document.getElementById('userInput').disabled = false;
                controller = null;
                input.focus();
            }
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
