        function showTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            
            // Remove existing indicator
            const existing = document.getElementById('typingIndicator');
            if (existing) existing.remove();
            
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'message assistant';
            indicatorDiv.id = 'typingIndicator';
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'message-header';
            headerDiv.innerHTML = '<div class="message-avatar">DS</div><span>DeepSeek</span>';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            
            indicatorDiv.appendChild(headerDiv);
            indicatorDiv.appendChild(typingDiv);
            messagesDiv.appendChild(indicatorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Start generation timer
        function startGenerationTimer() {
            generationStartTime = Date.now();
            const statusEl = document.getElementById('generationStatus');
            const timeEl = document.getElementById('generationTime');
            statusEl.style.display = 'flex';
            
            if (generationTimer) clearInterval(generationTimer);
            
            generationTimer = setInterval(() => {
                if (generationStartTime) {
                    const elapsed = Math.floor((Date.now() - generationStartTime) / 1000);
                    timeEl.textContent = elapsed;
                }
            }, 100);
        }

        // Stop generation timer
        function stopGenerationTimer() {
            if (generationTimer) {
                clearInterval(generationTimer);
                generationTimer = null;
            }
            document.getElementById('generationStatus').style.display = 'none';
        }

        // Stop generation function
        function stopGeneration() {
            if (abortController) {
                abortController.abort();
                abortController = null;
                
                removeTypingIndicator();
                stopGenerationTimer();
                
                // Re-enable input
                isProcessing = false;
                document.getElementById('userInput').disabled = false;
                document.getElementById('sendBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
            }
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message && attachedFiles.length === 0) return;
            
            if (!apiKey) {
                alert('Please enter your DeepSeek API key first!');
                return;
            }
            
            // Build message with files
            let fullMessage = message;
            
            if (attachedFiles.length > 0) {
                fullMessage += '\n\n--- Attached Files ---\n';
                
                for (const file of attachedFiles) {
                    if (file.type?.startsWith('image/')) {
                        fullMessage += `\n[Image: ${file.name}]`;
                    } else {
                        try {
                            fullMessage += `\n\n--- File: ${file.name} ---\n${file.data}\n`;
                        } catch (e) {
                            console.error('Error reading file:', e);
                        }
                    }
                }
            }
            
            // Add user message
            const userMessage = {
                role: 'user',
                content: fullMessage,
                timestamp: new Date().toLocaleTimeString(),
                files: [...attachedFiles]
            };
            
            addMessageToCurrentConversation(userMessage);
            displayMessage(userMessage);
            
            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            attachedFiles = [];
            displayAttachedFiles();
            
            // Show typing indicator
            showTypingIndicator();
            
            // Disable input
            isProcessing = true;
            document.getElementById('userInput').disabled = true;
            document.getElementById('sendBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            
            // Start timer
            startGenerationTimer();
            
            // Create new AbortController
            abortController = new AbortController();
            
            try {
                const conversation = conversations.find(c => c.id === currentConversationId);
                const apiMessages = conversation.messages.map(msg => ({
                    role: msg.role,
                    content: msg.content
                }));
                
                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: apiMessages,
                        temperature: temperature,
                        max_tokens: maxTokens,
                        stream: false
                    }),
                    signal: abortController.signal
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `API Error: ${response.status}`);
                }
                
                const data = await response.json();
                let assistantMessage = data.choices[0].message.content;
                
                removeTypingIndicator();
                stopGenerationTimer();
                
                const assistantResponse = {
                    role: 'assistant',
                    content: assistantMessage,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                addMessageToCurrentConversation(assistantResponse);
                displayMessage(assistantResponse);
                
                if (data.usage) {
                    document.getElementById('usageInfo').innerHTML = 
                        `💰 Tokens - Prompt: ${data.usage.prompt_tokens}, Completion: ${data.usage.completion_tokens}, Total: ${data.usage.total_tokens} | 🌡️ ${temperature.toFixed(1)} 📦 ${maxTokens}`;
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Generation stopped');
                } else {
                    console.error('Error:', error);
                    removeTypingIndicator();
                    stopGenerationTimer();
                    
                    const errorMessage = {
                        role: 'assistant',
                        content: `❌ Error: ${error.message}`,
                        timestamp: new Date().toLocaleTimeString()
                    };
                    
                    addMessageToCurrentConversation(errorMessage);
                    displayMessage(errorMessage);
                }
            } finally {
                isProcessing = false;
                document.getElementById('userInput').disabled = false;
                document.getElementById('sendBtn').style.display = 'flex';
                document.getElementById('stopBtn').style.display = 'none';
                abortController = null;
                userInput.focus();
            }
        }

        // Modal functions
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'flex';
            modalImg.src = imageSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Auto-resize textarea
        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
