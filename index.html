<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>DeepSeek Chat · draggable files & sync</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
      z-index: 100;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    #sidebar.hidden {
      transform: translateX(-100%);
    }
    #sidebar-header {
      padding: 20px 15px; border-bottom: 1px solid #222;
      font-weight: bold; font-size: 18px;
    }
    #new-chat-btn {
      margin: 15px; padding: 10px;
      background: #1a1a2e; border: 1px solid #333;
      border-radius: 8px; color: #e0e0e0;
      cursor: pointer; text-align: center; font-size: 14px;
    }
    #new-chat-btn:hover { background: #222; }
    #chat-list { flex: 1; overflow-y: auto; padding: 10px; }
    .chat-item {
      padding: 12px; margin: 4px 0; border-radius: 8px;
      cursor: pointer; font-size: 13px; color: #999;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-item:hover { background: #1a1a2e; color: #e0e0e0; }
    .chat-item.active { background: #1a1a2e; border: 1px solid #4a90d9; color: #e0e0e0; }
    .chat-item-title {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      user-select: none;
    }
    .chat-item-title input {
      background: #0d0d0d; border: 1px solid #4a90d9;
      color: #e0e0e0; padding: 2px 6px; font-size: 13px;
      border-radius: 4px; width: 100%; outline: none;
    }
    .chat-item-delete { color: #666; margin-left: 8px; cursor: pointer; font-weight: bold; }
    .chat-item-delete:hover { color: #f44; }
    #sidebar-footer {
      padding: 15px; border-top: 1px solid #222; font-size: 12px; color: #888;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sync-btns { display: flex; gap: 6px; }
    .sync-btn {
      background: #2a2a3a; border: 1px solid #444; color: #ccc;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
      flex: 1; text-align: center;
    }
    .sync-btn:hover { background: #3a3a4a; }
    #sidebarStatus { margin-top: 4px; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #1a1a2e;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }
    #main.full-width {
      margin-left: 0;
    }

    #header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 20px;
      background: #0d0d0d;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #222;
      flex-wrap: wrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #toggleSidebarBtn {
      background: none;
      border: 1px solid #444;
      color: #ccc;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: none;
      line-height: 1;
    }
    #header input {
      background: #1a1a2e; border: 1px solid #333;
      color: #e0e0e0; padding: 8px 12px;
      border-radius: 6px; font-size: 13px; width: 200px;
    }
    #header button, #header select {
      padding: 8px 12px; background: #4a90d9;
      color: white; border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    #header button:hover { background: #357abd; }
    #header select {
      background: #1a1a2e; color: #e0e0e0; border: 1px solid #333;
    }
    #validateAllBtn { background: #ff9800; }
    #validateAllBtn:hover { background: #f57c00; }
    #status { font-size: 12px; margin-left: auto; color: #4caf50; }

    /* Search styles */
    #searchToggle {
      background: none;
      border: 1px solid #555;
      color: #ccc;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    #searchContainer {
      display: none;
      align-items: center;
      gap: 4px;
      position: relative;
    }
    #searchContainer.visible {
      display: flex;
    }
    #searchInput {
      background: #1a1a2e;
      border: 1px solid #4a90d9;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      width: 180px;
    }
    #searchNav {
      display: flex;
      gap: 2px;
    }
    #searchNav button {
      background: #333;
      color: #ccc;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #searchNav button:hover { background: #444; }
    #searchResults {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 0 0 6px 6px;
      z-index: 20;
      font-size: 12px;
    }
    #searchResults.visible {
      display: block;
    }
    .search-result-item {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #222;
      display: flex;
      flex-direction: column;
    }
    .search-result-item:hover { background: #1a1a2e; }
    .search-result-chat {
      font-weight: bold;
      color: #4a90d9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result-snippet {
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-highlight {
      background: #ff9800;
      color: #000;
      border-radius: 2px;
      padding: 0 2px;
    }
    .search-current-highlight {
      background: #f44336;
      color: white;
      border-radius: 2px;
      padding: 0 2px;
    }
    #matchCounter {
      font-size: 12px;
      color: #ccc;
      margin-left: 5px;
    }

    #messages {
      flex: 1;
      padding: 20px;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }
    .msg {
      margin-bottom: 20px; padding: 15px; border-radius: 10px;
      max-width: 85%; word-break: break-word;
      font-size: 14px; line-height: 1.6;
    }
    .user { background: #16213e; margin-left: auto; }
    .assistant { background: #0f3460; margin-right: auto; }

    .msg h1, .msg h2, .msg h3 { color: #4a90d9; margin: 15px 0 10px; }
    .msg h1 { font-size: 1.5em; }
    .msg h2 { font-size: 1.3em; }
    .msg h3 { font-size: 1.1em; }
    .msg table { 
      border-collapse: collapse; width: 100%; 
      margin: 15px 0; display: block; overflow-x: auto; 
    }
    .msg th, .msg td { 
      border: 1px solid #444; padding: 8px 12px; 
      text-align: left; white-space: normal; 
    }
    .msg th { background: #222; font-weight: bold; color: #4a90d9; }
    .msg hr { border: 0; border-top: 1px solid #333; margin: 15px 0; }
    .msg strong { color: #fff; font-weight: 600; }
    .msg em { color: #ccc; }
    .msg blockquote { 
      border-left: 3px solid #4a90d9; padding-left: 15px; 
      margin: 10px 0; color: #aaa; 
    }
    .msg ul, .msg ol { margin: 10px 0; padding-left: 25px; }
    .msg li { margin: 5px 0; }
    .msg code:not(pre code) { 
      background: #222; padding: 2px 6px; 
      border-radius: 3px; font-family: 'Courier New', monospace; 
      color: #a8d8a8; font-size: 0.9em;
    }
    .msg p { margin: 8px 0; }

    .code-block {
      background: #0d0d0d; border: 1px solid #333;
      border-radius: 8px; margin: 10px 0; overflow: hidden;
    }
    .code-header {
      background: #222; padding: 8px 15px;
      display: flex; justify-content: space-between;
      align-items: center; font-size: 12px; color: #888; flex-wrap: wrap;
    }
    .code-header button {
      background: #333; color: #ccc; border: none;
      padding: 4px 10px; border-radius: 4px;
      cursor: pointer; font-size: 11px; margin-left: 5px;
    }
    .code-header button:hover { background: #444; }
    .code-content {
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 13px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      overflow-x: auto; color: #a8d8a8;
    }
    .validation-badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: 8px;
    }
    .validation-pass { background: #1b5e20; color: #4caf50; }
    .validation-warn { background: #e65100; color: #ff9800; }
    .validation-error { background: #b71c1c; color: #f44336; }
    .validation-details {
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; padding: 10px; margin-top: 8px;
      font-size: 12px; font-family: 'Courier New', monospace; display: none;
    }
    .validation-details.show { display: block; }
    .error-line { color: #f44336; }
    .warn-line { color: #ff9800; }
    .ok-line { color: #4caf50; }

    #input-area {
      position: sticky;
      bottom: 0;
      z-index: 10;
      background: #0d0d0d;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
      border-top: 1px solid #222;
      transition: background 0.2s, border 0.2s;
    }
    #input-area.drag-over {
      background: #1a1a3e;
      border-top: 2px dashed #4a90d9;
    }
    .attached-files { display: flex; flex-wrap: wrap; gap: 6px; }
    .attached-file {
      background: #1a1a2e; border: 1px solid #333;
      border-radius: 16px; padding: 4px 12px;
      font-size: 12px; display: flex; align-items: center; gap: 6px;
      color: #ccc;
    }
    .attached-file .remove-file { cursor: pointer; color: #888; font-weight: bold; }
    .attached-file .remove-file:hover { color: #f44; }
    .input-row { display: flex; gap: 10px; align-items: center; }
    #userInput {
      flex: 1; padding: 12px;
      border: 1px solid #333; border-radius: 8px;
      background: #1a1a2e; color: #e0e0e0;
      font-family: inherit; font-size: 14px;
      resize: none; outline: none;
    }
    #userInput:focus { border-color: #4a90d9; }
    #sendBtn, #stopBtn, #attachBtn {
      padding: 12px 16px; color: white; border: none;
      border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    #sendBtn { background: #4a90d9; }
    #sendBtn:hover { background: #357abd; }
    #sendBtn:disabled { opacity: 0.5; }
    #stopBtn { background: #d94a4a; }
    #stopBtn:hover { background: #c0392b; }
    #attachBtn { background: #555; }
    #attachBtn:hover { background: #666; }
    .drag-hint { font-size: 11px; color: #666; text-align: center; }
    
    @media (max-width: 600px) {
      #sidebar {
        transform: translateX(-100%);
      }
      #sidebar.visible {
        transform: translateX(0);
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      }
      #main {
        margin-left: 0;
      }
      #toggleSidebarBtn {
        display: inline-block;
      }
      #header {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 6px;
        padding: 10px;
      }
      #header input {
        width: 120px;
      }
      #searchInput {
        width: 120px;
      }
      #messages {
        padding: 10px;
      }
      .msg {
        max-width: 95%;
      }
      #input-area {
        padding: 10px;
      }
      .drag-hint {
        display: none;
      }
    }
    
    @media (max-width: 400px) {
      #header input {
        width: 80px;
        font-size: 11px;
      }
      #header button, #header select {
        padding: 6px 8px;
        font-size: 11px;
      }
      #toggleSidebarBtn {
        font-size: 16px;
        padding: 3px 6px;
      }
      #sendBtn, #stopBtn, #attachBtn {
        padding: 10px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">💬 DeepSeek Chat</div>
  <div id="new-chat-btn">+ New Chat</div>
  <div id="chat-list"></div>
  <div id="sidebar-footer">
    <div class="sync-btns">
      <button class="sync-btn" id="exportChatsBtn">📤 Export</button>
      <button class="sync-btn" id="importChatsBtn">📥 Import</button>
    </div>
    <div id="sidebarStatus">⚡ API status</div>
  </div>
</div>

<div id="main">
  <div id="header">
    <button id="toggleSidebarBtn" title="Toggle sidebar">☰</button>
    <span style="color:#888;">Key:</span>
    <input type="password" id="apiKey" placeholder="sk-...">
    <button id="saveKeyBtn">Save</button>
    <select id="modelSelect">
      <option value="deepseek-v4-pro">deepseek-v4-pro</option>
      <option value="deepseek-v4-flash">deepseek-v4-flash</option>
      <option value="deepseek-chat">deepseek-chat (legacy)</option>
      <option value="deepseek-reasoner">deepseek-reasoner (legacy)</option>
    </select>
    <label style="color:#888; font-size:12px; display:flex; align-items:center; gap:4px;">
      <input type="checkbox" id="thinkingToggle"> Thinking
    </label>
    <button id="validateAllBtn">🔍 Validate</button>
    <!-- Search toggle button -->
    <button id="searchToggle" title="Search messages">🔍</button>
    <div id="searchContainer">
      <input type="text" id="searchInput" placeholder="Search all chats...">
      <div id="searchNav">
        <button id="prevMatch" title="Previous match">▲</button>
        <button id="nextMatch" title="Next match">▼</button>
      </div>
      <span id="matchCounter"></span>
      <div id="searchResults"></div>
    </div>
    <span id="status">⚪</span>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div class="attached-files" id="attachedFiles"></div>
    <div class="input-row">
      <textarea id="userInput" rows="1" placeholder="Message DeepSeek... Drag & drop files here"></textarea>
      <button id="attachBtn" title="Attach files">📎</button>
      <button id="sendBtn">Send</button>
      <button id="stopBtn" style="display:none;">Stop</button>
    </div>
    <div class="drag-hint">Drop .py .xml .txt .html .js .css .json .md .csv (max 1MB each)</div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept=".py,.xml,.txt,.html,.js,.css,.json,.md,.csv" style="display:none;">

<script>
  (function() {
    const API_URL = 'https://api.deepseek.com/chat/completions';

    // ── IndexedDB ──
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('ds_chat_storage', 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('chats')) {
            db.createObjectStore('chats');
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function loadChatsFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readonly');
        const store = tx.objectStore('chats');
        const request = store.get('ds_chats');
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveChatsToDB(chatsArray) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readwrite');
        const store = tx.objectStore('chats');
        store.put(chatsArray, 'ds_chats');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // ── App state ──
    let apiKey = localStorage.getItem('ds_key') || '';
    let chats = [];
    let currentChatId = null;
    let isProcessing = false;
    let controller = null;
    let attachedFiles = [];
    // Search state
    let searchQuery = '';
    let allMatches = [];           // { chatId, msgIdx, element (DOM node), startOffset, endOffset }
    let currentMatchIdx = -1;

    const apiKeyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('modelSelect');
    const thinkingToggle = document.getElementById('thinkingToggle');
    const statusEl = document.getElementById('status');
    const sidebarStatus = document.getElementById('sidebarStatus');
    const chatListEl = document.getElementById('chat-list');
    const messagesEl = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const inputArea = document.getElementById('input-area');
    const attachedFilesContainer = document.getElementById('attachedFiles');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const mainEl = document.getElementById('main');

    // Search elements
    const searchToggle = document.getElementById('searchToggle');
    const searchContainer = document.getElementById('searchContainer');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const prevMatchBtn = document.getElementById('prevMatch');
    const nextMatchBtn = document.getElementById('nextMatch');
    const matchCounter = document.getElementById('matchCounter');

    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
    }

    // ── Sidebar / UI ──
    function toggleSidebar() {
      sidebar.classList.toggle('visible');
      if (window.innerWidth <= 600) {
        mainEl.classList.toggle('full-width', !sidebar.classList.contains('visible'));
      }
    }
    toggleSidebarBtn.addEventListener('click', toggleSidebar);

    function handleChatSelection() {
      if (window.innerWidth <= 600) {
        sidebar.classList.remove('visible');
        mainEl.classList.add('full-width');
      }
    }

    function scrollToBottom() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
    }

    apiKeyInput.value = apiKey;
    const savedModel = localStorage.getItem('ds_model') || 'deepseek-v4-pro';
    modelSelect.value = savedModel;
    thinkingToggle.checked = localStorage.getItem('ds_thinking') === 'true';
    updateStatus();

    document.getElementById('saveKeyBtn').addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('ds_key', apiKey);
      updateStatus();
    });

    modelSelect.addEventListener('change', () => {
      localStorage.setItem('ds_model', modelSelect.value);
      updateStatus();
    });

    thinkingToggle.addEventListener('change', () => {
      localStorage.setItem('ds_thinking', thinkingToggle.checked);
    });

    function updateStatus() {
      const model = modelSelect.value;
      if (apiKey) {
        statusEl.textContent = `✅ Ready | ${model}`;
        statusEl.style.color = '#4caf50';
        sidebarStatus.textContent = `✅ ${model}`;
        sidebarStatus.style.color = '#4caf50';
      } else {
        statusEl.textContent = '❌ Set API key';
        statusEl.style.color = '#f44';
        sidebarStatus.textContent = '❌ No API key';
        sidebarStatus.style.color = '#f44';
      }
    }

    async function saveChats() {
      try {
        await saveChatsToDB(chats);
      } catch (e) {
        alert('❌ Failed to save chats: ' + e.message);
      }
    }

    function getChatTitle(chat) {
      if (chat.title && chat.title.trim()) return chat.title;
      const first = chat.messages.find(m => m.role === 'user');
      return first ? first.content.substring(0, 35) : 'New Chat';
    }

    const clickTimers = {};

    function renderChatList() {
      chatListEl.innerHTML = '';
      chats.sort((a, b) => b.updatedAt - a.updatedAt);
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');

        const titleSpan = document.createElement('span');
        titleSpan.className = 'chat-item-title';
        titleSpan.textContent = getChatTitle(chat);

        titleSpan.addEventListener('dblclick', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (clickTimers[chat.id]) {
            clearTimeout(clickTimers[chat.id]);
            delete clickTimers[chat.id];
          }
          startRename(chat, titleSpan);
        });

        titleSpan.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (clickTimers[chat.id]) return;
          clickTimers[chat.id] = setTimeout(() => {
            delete clickTimers[chat.id];
            loadChat(chat.id);
            handleChatSelection();
          }, 300);
        });

        const delSpan = document.createElement('span');
        delSpan.className = 'chat-item-delete';
        delSpan.textContent = '×';
        delSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          if (clickTimers[chat.id]) {
            clearTimeout(clickTimers[chat.id]);
            delete clickTimers[chat.id];
          }
          deleteChat(chat.id);
        });

        div.appendChild(titleSpan);
        div.appendChild(delSpan);
        chatListEl.appendChild(div);
      });
    }

    async function startRename(chat, span) {
      const currentTitle = getChatTitle(chat);
      const input = document.createElement('input');
      input.value = currentTitle;
      span.innerHTML = '';
      span.appendChild(input);
      input.focus();
      input.select();

      const finish = async () => {
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== currentTitle) {
          chat.title = newTitle;
        } else if (!newTitle) {
          delete chat.title;
        }
        chat.updatedAt = Date.now();
        await saveChats();
        renderChatList();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          input.blur();
        } else if (e.key === 'Escape') {
          span.innerHTML = '';
          span.textContent = currentTitle;
          input.removeEventListener('blur', onBlur);
        }
      });

      const onBlur = () => finish();
      input.addEventListener('blur', onBlur);
    }

    function newChat() {
      currentChatId = 'chat_' + Date.now();
      chats.push({ id: currentChatId, messages: [], createdAt: Date.now(), updatedAt: Date.now() });
      saveChats();
      renderChatList();
      messagesEl.innerHTML = ''; attachedFiles = []; renderAttachedFiles();
      // Clear search when creating new chat
      clearSearch();
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      messagesEl.innerHTML = ''; attachedFiles = []; renderAttachedFiles();
      if (chat?.messages) {
        chat.messages.forEach((m, idx) => {
          const div = document.createElement('div');
          div.className = `msg ${m.role}`;
          div.dataset.chatId = chat.id;
          div.dataset.msgIdx = idx;
          div.innerHTML = formatContent(m.content);
          messagesEl.appendChild(div);
        });
        scrollToBottom();
        setTimeout(validateAllCodeBlocks, 400);
      }
      renderChatList();
      // If there's an active search, re-apply highlights to the newly loaded chat
      if (searchQuery) {
        applySearchHighlights();
      }
    }

    async function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      if (currentChatId === id) { currentChatId = null; messagesEl.innerHTML = ''; }
      if (!chats.length) newChat();
      else if (!currentChatId) loadChat(chats[0].id);
      await saveChats();
      renderChatList();
      if (searchQuery) {
        // Update search results if chat deleted
        performSearch(searchQuery);
      }
    }

    document.getElementById('new-chat-btn').addEventListener('click', () => {
      newChat();
      handleChatSelection();
    });

    // ── File handling (unchanged) ──
    function processFiles(files) { /* ... same as before ... */
      const allowed = ['.py','.xml','.txt','.html','.js','.css','.json','.md','.csv'];
      Array.from(files).forEach(file => {
        const ext = '.' + file.name.split('.').pop().toLowerCase();
        if (!allowed.includes(ext)) { alert(`"${file.name}" not allowed`); return; }
        if (file.size > 1024*1024) { alert(`"${file.name}" too large`); return; }
        if (attachedFiles.find(f => f.name === file.name)) { alert(`"${file.name}" already attached`); return; }
        const reader = new FileReader();
        reader.onload = (e) => {
          attachedFiles.push({ name: file.name, type: file.type, size: file.size, content: e.target.result, icon: getFileIcon(file.name) });
          renderAttachedFiles();
        };
        reader.onerror = () => alert(`Failed to read ${file.name}`);
        reader.readAsText(file);
      });
    }

    function getFileIcon(name) {
      const icons = { py:'🐍', xml:'📰', txt:'📄', html:'🌐', js:'📜', css:'🎨', json:'📋', md:'📘', csv:'📊' };
      return icons[name.split('.').pop().toLowerCase()] || '📎';
    }

    function renderAttachedFiles() {
      attachedFilesContainer.innerHTML = '';
      attachedFiles.forEach((f, i) => {
        const chip = document.createElement('div');
        chip.className = 'attached-file';
        chip.innerHTML = `${f.icon} ${f.name} (${(f.size/1024).toFixed(1)}KB) <span class="remove-file">×</span>`;
        chip.querySelector('.remove-file').addEventListener('click', () => { attachedFiles.splice(i,1); renderAttachedFiles(); });
        attachedFilesContainer.appendChild(chip);
      });
    }

    ['dragenter','dragover','dragleave','drop'].forEach(ev => {
      document.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
    });
    inputArea.addEventListener('dragenter', () => inputArea.classList.add('drag-over'));
    inputArea.addEventListener('dragover', () => inputArea.classList.add('drag-over'));
    inputArea.addEventListener('dragleave', () => inputArea.classList.remove('drag-over'));
    inputArea.addEventListener('drop', e => {
      inputArea.classList.remove('drag-over');
      if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
    });
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) processFiles(e.target.files);
      fileInput.value = '';
    });

    function escapeHtml(t) { 
      const d = document.createElement('div'); d.textContent = t; return d.innerHTML; 
    }

    function formatContent(content) {
      if (!content) return '';
      const parts = content.split('```');
      let html = '';
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          if (parts[i].trim()) {
            html += typeof marked !== 'undefined' 
              ? marked.parse(parts[i]) 
              : escapeHtml(parts[i]).replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
          }
        } else {
          const code = parts[i];
          const nl = code.indexOf('\n');
          const lang = nl > -1 ? code.substring(0, nl).trim() : 'code';
          const codeContent = nl > -1 ? code.substring(nl + 1) : code;
          const id = 'c' + Math.random().toString(36).substring(2, 10);
          const ext = lang === 'python' ? 'py' : lang === 'xml' ? 'xml' : lang === 'html' ? 'html' : 'txt';
          html += `<div class="code-block" data-code-id="${id}">
            <div class="code-header">
              <span>${escapeHtml(lang)} <span class="validation-badge" id="badge-${id}"></span></span>
              <span>
                <button class="copy-btn" data-id="${id}">Copy</button>
                <button class="download-btn" data-id="${id}" data-ext="${ext}">Download</button>
                <button class="validate-btn" data-id="${id}" style="background:#ff9800;">🔍</button>
              </span>
            </div>
            <div class="code-content"><code id="${id}">${escapeHtml(codeContent.trim())}</code></div>
            <div class="validation-details" id="details-${id}"></div>
          </div>`;
        }
      }
      return html;
    }

    // ── Search implementation ──
    function openSearch() {
      searchContainer.classList.add('visible');
      searchInput.focus();
    }
    function closeSearch() {
      searchContainer.classList.remove('visible');
      searchResults.classList.remove('visible');
      searchInput.value = '';
      clearSearch();
    }

    searchToggle.addEventListener('click', () => {
      if (searchContainer.classList.contains('visible')) {
        closeSearch();
      } else {
        openSearch();
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (query) {
          performSearch(query);
        } else {
          clearSearch();
        }
      } else if (e.key === 'Escape') {
        closeSearch();
      }
    });

    // Perform search across all chats
    function performSearch(query) {
      searchQuery = query.toLowerCase();
      allMatches = [];
      currentMatchIdx = -1;

      // Search in memory (chats array)
      const results = []; // for dropdown: { chatId, chatTitle, snippet, msgIdx }
      chats.forEach(chat => {
        chat.messages.forEach((msg, msgIdx) => {
          const content = msg.content;
          const lowerContent = content.toLowerCase();
          let startIdx = 0;
          while ((startIdx = lowerContent.indexOf(searchQuery, startIdx)) !== -1) {
            // We'll store a reference to the message element later when chat is loaded
            results.push({
              chatId: chat.id,
              msgIdx,
              startIdx,
              endIdx: startIdx + searchQuery.length,
              snippet: content.substring(Math.max(0, startIdx - 20), startIdx + searchQuery.length + 20)
            });
            startIdx += searchQuery.length;
          }
        });
      });

      // Show dropdown
      renderSearchDropdown(results);

      // If currently loaded chat has matches, apply highlights
      applySearchHighlights();
    }

    function renderSearchDropdown(results) {
      searchResults.innerHTML = '';
      if (results.length === 0) {
        searchResults.innerHTML = '<div style="padding:8px;color:#888;">No matches found</div>';
        searchResults.classList.add('visible');
        return;
      }
      // Group by chat, show first match per chat for brevity? Better to show each match as an item
      results.forEach((res, i) => {
        const chat = chats.find(c => c.id === res.chatId);
        const title = getChatTitle(chat);
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.innerHTML = `
          <div class="search-result-chat">${escapeHtml(title)}</div>
          <div class="search-result-snippet">...${escapeHtml(res.snippet)}...</div>
        `;
        item.addEventListener('click', () => {
          // Load that chat and jump to the specific message
          if (currentChatId !== res.chatId) {
            loadChat(res.chatId);
          }
          // After load, scroll to message and highlight first match in that message
          setTimeout(() => {
            scrollToMessage(res.chatId, res.msgIdx);
            // Apply highlights again to make sure
            applySearchHighlights();
            // Find the first match in that message and set as current
            const msgMatches = allMatches.filter(m => m.chatId === res.chatId && m.msgIdx === res.msgIdx);
            if (msgMatches.length > 0) {
              currentMatchIdx = allMatches.indexOf(msgMatches[0]);
              updateCurrentHighlight();
            }
          }, 100);
          searchResults.classList.remove('visible');
        });
        searchResults.appendChild(item);
      });
      searchResults.classList.add('visible');
    }

    function scrollToMessage(chatId, msgIdx) {
      const msgEl = messagesEl.querySelector(`.msg[data-chat-id="${chatId}"][data-msg-idx="${msgIdx}"]`);
      if (msgEl) {
        msgEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        msgEl.style.transition = 'box-shadow 0.5s';
        msgEl.style.boxShadow = '0 0 15px #4a90d9';
        setTimeout(() => { msgEl.style.boxShadow = ''; }, 1500);
      }
    }

    function applySearchHighlights() {
      // Remove all existing highlights first
      removeHighlights();
      if (!searchQuery) return;
      allMatches = [];
      const msgs = messagesEl.querySelectorAll('.msg');
      msgs.forEach(msgEl => {
        const chatId = msgEl.dataset.chatId;
        const msgIdx = parseInt(msgEl.dataset.msgIdx);
        highlightTextInElement(msgEl, searchQuery, chatId, msgIdx);
      });
      updateMatchCounter();
      if (allMatches.length > 0) {
        currentMatchIdx = 0;
        updateCurrentHighlight();
        scrollToMatch(currentMatchIdx);
      }
    }

    function highlightTextInElement(element, query, chatId, msgIdx) {
      // Walk through text nodes and wrap matches
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          if (node.parentElement.tagName === 'MARK') return NodeFilter.FILTER_REJECT; // already highlighted
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      textNodes.forEach(node => {
        const text = node.textContent;
        const lowerText = text.toLowerCase();
        let idx = lowerText.indexOf(query);
        if (idx === -1) return;
        const fragment = document.createDocumentFragment();
        let lastIdx = 0;
        while (idx !== -1) {
          // Text before match
          if (idx > lastIdx) {
            fragment.appendChild(document.createTextNode(text.substring(lastIdx, idx)));
          }
          // Create highlight mark
          const mark = document.createElement('mark');
          mark.className = 'search-highlight';
          mark.textContent = text.substring(idx, idx + query.length);
          fragment.appendChild(mark);
          // Store match info
          allMatches.push({
            chatId,
            msgIdx,
            element: mark,
          });
          lastIdx = idx + query.length;
          idx = lowerText.indexOf(query, lastIdx);
        }
        if (lastIdx < text.length) {
          fragment.appendChild(document.createTextNode(text.substring(lastIdx)));
        }
        node.parentNode.replaceChild(fragment, node);
      });
    }

    function removeHighlights() {
      const marks = messagesEl.querySelectorAll('mark.search-highlight, mark.search-current-highlight');
      marks.forEach(mark => {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize(); // merge adjacent text nodes
      });
      allMatches = [];
      currentMatchIdx = -1;
      updateMatchCounter();
    }

    function clearSearch() {
      searchQuery = '';
      searchInput.value = '';
      removeHighlights();
      searchResults.classList.remove('visible');
      matchCounter.textContent = '';
    }

    function updateCurrentHighlight() {
      // Remove current highlight class from all marks
      messagesEl.querySelectorAll('mark.search-current-highlight').forEach(m => {
        m.classList.remove('search-current-highlight');
        m.classList.add('search-highlight');
      });
      if (currentMatchIdx >= 0 && currentMatchIdx < allMatches.length) {
        const currentMark = allMatches[currentMatchIdx].element;
        currentMark.classList.remove('search-highlight');
        currentMark.classList.add('search-current-highlight');
      }
      updateMatchCounter();
    }

    function updateMatchCounter() {
      if (allMatches.length === 0) {
        matchCounter.textContent = '';
      } else {
        const current = currentMatchIdx >= 0 ? currentMatchIdx + 1 : 0;
        matchCounter.textContent = `${current}/${allMatches.length}`;
      }
    }

    function scrollToMatch(index) {
      if (index < 0 || index >= allMatches.length) return;
      const mark = allMatches[index].element;
      mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    prevMatchBtn.addEventListener('click', () => {
      if (allMatches.length === 0) return;
      currentMatchIdx = (currentMatchIdx - 1 + allMatches.length) % allMatches.length;
      updateCurrentHighlight();
      scrollToMatch(currentMatchIdx);
    });

    nextMatchBtn.addEventListener('click', () => {
      if (allMatches.length === 0) return;
      currentMatchIdx = (currentMatchIdx + 1) % allMatches.length;
      updateCurrentHighlight();
      scrollToMatch(currentMatchIdx);
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!searchContainer.contains(e.target) && e.target !== searchToggle) {
        searchResults.classList.remove('visible');
      }
    });

    // ── Validation (unchanged) ──
    function detectLang(c) { /* ... */ }
    function validatePython(c) { /* ... */ }
    function validateGeneric(c) { /* ... */ }
    function validateCodeBlock(id) { /* ... */ }
    function validateAllCodeBlocks() {
      document.querySelectorAll('[data-code-id]').forEach(b => validateCodeBlock(b.dataset.codeId));
    }
    document.getElementById('validateAllBtn').addEventListener('click', validateAllCodeBlocks);

    // ── Send / stop (unchanged, but remember to clear search on new message) ──
    function stop() { /* ... */ }
    async function send() {
      if (isProcessing || !apiKey) return;
      if (!currentChatId) newChat();
      const text = userInput.value.trim();
      if (!text && !attachedFiles.length) return;

      let full = text;
      if (attachedFiles.length) {
        if (full) full += '\n\n';
        full += '--- Attached Files ---\n';
        attachedFiles.forEach(f => full += `\n### ${f.name}\n\`\`\`\n${f.content}\n\`\`\`\n`);
      }

      const chat = chats.find(c => c.id === currentChatId);
      chat.messages.push({ role: 'user', content: full });
      chat.updatedAt = Date.now(); await saveChats(); renderChatList();

      const div = document.createElement('div'); div.className = 'msg user';
      div.dataset.chatId = currentChatId;
      div.dataset.msgIdx = chat.messages.length - 1;
      div.innerHTML = escapeHtml(text) + (attachedFiles.length ? '<br><br>📎 '+attachedFiles.map(f=>f.name).join(', ') : '');
      messagesEl.appendChild(div);
      scrollToBottom();
      userInput.value = ''; userInput.style.height = 'auto';
      attachedFiles = []; renderAttachedFiles();

      isProcessing = true; sendBtn.disabled = true; attachBtn.disabled = true;
      stopBtn.style.display = 'inline'; userInput.disabled = true;
      controller = new AbortController();

      try {
        const msgs = chat.messages.map(m => ({ role: m.role, content: m.content }));
        const requestBody = {
          model: modelSelect.value,
          messages: msgs,
          stream: false
        };
        if (thinkingToggle.checked) {
          requestBody.thinking = { type: "enabled" };
          requestBody.reasoning_effort = "high";
        }
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify(requestBody),
          signal: controller.signal
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
        if (!data.choices?.[0]?.message?.content) throw new Error('Invalid response format');
        const content = data.choices[0].message.content;
        chat.messages.push({ role: 'assistant', content }); chat.updatedAt = Date.now(); await saveChats();

        const adiv = document.createElement('div'); adiv.className = 'msg assistant';
        adiv.dataset.chatId = currentChatId;
        adiv.dataset.msgIdx = chat.messages.length - 1;
        adiv.innerHTML = formatContent(content);
        messagesEl.appendChild(adiv);
        scrollToBottom();
        setTimeout(() => adiv.querySelectorAll('[data-code-id]').forEach(b => validateCodeBlock(b.dataset.codeId)), 100);
      } catch (err) {
        if (err.name !== 'AbortError') {
          const ediv = document.createElement('div'); ediv.className = 'msg assistant';
          ediv.dataset.chatId = currentChatId;
          ediv.dataset.msgIdx = chat.messages.length - 1; // error message is also a message
          ediv.textContent = '❌ ' + err.message; messagesEl.appendChild(ediv);
          scrollToBottom();
        }
      } finally {
        isProcessing = false; sendBtn.disabled = false; attachBtn.disabled = false;
        stopBtn.style.display = 'none'; userInput.disabled = false; controller = null;
        userInput.focus();
      }
      // Re-apply search highlights if search is active
      if (searchQuery) {
        applySearchHighlights();
      }
    }

    sendBtn.addEventListener('click', send);
    stopBtn.addEventListener('click', stop);
    userInput.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); send(); } });
    userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 150) + 'px'; });

    // Export / Import (unchanged)
    document.getElementById('exportChatsBtn').addEventListener('click', () => { /* ... */ });
    document.getElementById('importChatsBtn').addEventListener('click', () => { /* ... */ });

    async function initApp() {
      try {
        chats = await loadChatsFromDB();
      } catch (e) {
        alert('Failed to load chats from storage: ' + e.message);
        chats = [];
      }
      if (!chats.length) newChat();
      else loadChat(chats[0].id);
      renderChatList();
      if (window.innerWidth <= 600) {
        sidebar.classList.remove('visible');
        mainEl.classList.add('full-width');
      }
      if (currentChatId) setTimeout(validateAllCodeBlocks, 600);
    }

    initApp();
  })();
