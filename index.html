<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
        }
        
        #sidebar {
            width: 260px;
            min-width: 260px;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
        }
        #sidebar-header {
            padding: 20px 15px;
            border-bottom: 1px solid #222;
            font-weight: bold;
            font-size: 18px;
        }
        #new-chat-btn {
            margin: 15px;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }
        #new-chat-btn:hover { background: #222; }
        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .chat-item {
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #999;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item:hover { background: #1a1a2e; color: #e0e0e0; }
        .chat-item.active { background: #1a1a2e; border-color: #4a90d9; color: #e0e0e0; }
        .chat-item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-item-delete {
            color: #666;
            margin-left: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .chat-item-delete:hover { color: #f44; }
        #sidebar-footer {
            padding: 15px;
            border-top: 1px solid #222;
            font-size: 12px;
            color: #888;
        }
        
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        #header {
            padding: 12px 20px;
            background: #0d0d0d;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        #header input {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            width: 280px;
        }
        #header button {
            padding: 8px 16px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        #header button:hover { background: #357abd; }
        #status { font-size: 12px; margin-left: auto; }
        #status.ready { color: #4caf50; }
        #status.no-key { color: #f44336; }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
        }
        .msg {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            max-width: 85%;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.6;
        }
        .user { background: #16213e; margin-left: auto; }
        .assistant { background: #0f3460; margin-right: auto; }
        
        .code-block {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        .code-header {
            background: #222;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }
        .code-header button {
            background: #333;
            color: #ccc;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 5px;
        }
        .code-header button:hover { background: #444; }
        .code-content {
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            color: #a8d8a8;
        }
        
        #input-area {
            padding: 15px 20px;
            background: #0d0d0d;
            display: flex;
            gap: 10px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            border-top: 1px solid #222;
        }
        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        #userInput:focus { border-color: #4a90d9; }
        #sendBtn, #continueBtn, #stopBtn {
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        #sendBtn { background: #4a90d9; }
        #sendBtn:hover { background: #357abd; }
        #sendBtn:disabled { opacity: 0.5; }
        #continueBtn { background: #4caf50; }
        #continueBtn:hover { background: #388e3c; }
        #stopBtn { background: #d94a4a; }
        #stopBtn:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">💬 Chats</div>
        <div id="new-chat-btn" onclick="newChat()">+ New Chat</div>
        <div id="chat-list"></div>
        <div id="sidebar-footer">
            <div id="sidebarStatus"></div>
        </div>
    </div>
    
    <div id="main">
        <div id="header">
            <span style="color:#888;">API Key:</span>
            <input type="password" id="apiKey" placeholder="sk-...">
            <button onclick="saveKey()">Save</button>
            <span id="status" class="no-key">Set API key</span>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-area">
            <textarea id="userInput" rows="1" placeholder="Ask anything..." 
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
            <button id="sendBtn" onclick="send()">Send</button>
            <button id="continueBtn" onclick="continueGeneration()" style="display:none;">Continue</button>
            <button id="stopBtn" onclick="stop()" style="display:none;">Stop</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';
        let apiKey = localStorage.getItem('ds_key') || '';
        let chats = JSON.parse(localStorage.getItem('ds_chats') || '[]');
        let currentChatId = null;
        let isProcessing = false;
        let controller = null;

        document.getElementById('apiKey').value = apiKey;
        updateStatus();
        renderChatList();

        function saveKey() {
            apiKey = document.getElementById('apiKey').value.trim();
            localStorage.setItem('ds_key', apiKey);
            updateStatus();
        }

        function updateStatus() {
            const status = document.getElementById('status');
            const sidebarStatus = document.getElementById('sidebarStatus');
            if (apiKey) {
                status.textContent = 'Ready';
                status.className = 'ready';
                sidebarStatus.textContent = '✅ API Ready';
                sidebarStatus.style.color = '#4caf50';
            } else {
                status.textContent = 'Set API key';
                status.className = 'no-key';
                sidebarStatus.textContent = '❌ No API key';
                sidebarStatus.style.color = '#f44336';
            }
        }

        function saveChats() {
            localStorage.setItem('ds_chats', JSON.stringify(chats));
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            chats.sort((a, b) => b.updatedAt - a.updatedAt);
            
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
                div.onclick = () => loadChat(chat.id);
                
                const title = chat.messages.find(m => m.role === 'user')?.content?.substring(0, 30) || 'New Chat';
                
                div.innerHTML = `
                    <span class="chat-item-title">${escapeHtml(title)}</span>
                    <span class="chat-item-delete" onclick="event.stopPropagation();deleteChat('${chat.id}')">×</span>`;
                list.appendChild(div);
            });
        }

        function newChat() {
            const id = 'chat_' + Date.now();
            currentChatId = id;
            chats.push({
                id: id,
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now()
            });
            saveChats();
            renderChatList();
            document.getElementById('messages').innerHTML = '';
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            const container = document.getElementById('messages');
            container.innerHTML = '';
            
            if (chat && chat.messages) {
                chat.messages.forEach(m => renderMessage(m));
                container.scrollTop = container.scrollHeight;
            }
            renderChatList();
            checkIncomplete();
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = null;
                document.getElementById('messages').innerHTML = '';
            }
            if (chats.length === 0) newChat();
            else if (!currentChatId) loadChat(chats[0].id);
            saveChats();
            renderChatList();
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function formatContent(content) {
            if (!content) return '';
            
            const parts = content.split('```');
            let html = '';
            
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    if (parts[i].trim()) {
                        html += escapeHtml(parts[i]).replace(/\n/g, '<br>');
                    }
                } else {
                    const code = parts[i];
                    const nl = code.indexOf('\n');
                    const lang = nl > -1 ? code.substring(0, nl).trim() : '';
                    const codeContent = nl > -1 ? code.substring(nl + 1) : code;
                    const id = 'c' + Math.random().toString(36).substr(2, 8);
                    const ext = lang === 'python' ? 'py' : lang === 'xml' ? 'xml' : lang === 'html' ? 'html' : 'txt';
                    
                    html += `
                        <div class="code-block">
                            <div class="code-header">
                                <span>${escapeHtml(lang || 'code')}</span>
                                <span>
                                    <button onclick="copyCode('${id}')">Copy</button>
                                    <button onclick="downloadCode('${id}','${ext}')">Download</button>
                                </span>
                            </div>
                            <div class="code-content"><code id="${id}">${escapeHtml(codeContent.trim())}</code></div>
                        </div>`;
                }
            }
            return html;
        }

        function copyCode(id) {
            const el = document.getElementById(id);
            if (el) navigator.clipboard.writeText(el.textContent);
        }

        function downloadCode(id, ext) {
            const el = document.getElementById(id);
            if (el) {
                const blob = new Blob([el.textContent], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `code.${ext}`;
                a.click();
            }
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.className = `msg ${msg.role}`;
            div.innerHTML = formatContent(msg.content);
            document.getElementById('messages').appendChild(div);
        }

        function addMessage(role, content) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            chat.messages.push({ role, content });
            chat.updatedAt = Date.now();
            saveChats();
            renderChatList();
            renderMessage({ role, content });
            
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            
            // Check if continue button should be shown
            if (role === 'assistant') {
                checkIncomplete();
            }
        }

        function isIncomplete(content) {
            if (!content) return false;
            
            // Unclosed code block
            const codeBlocks = (content.match(/```/g) || []).length;
            if (codeBlocks % 2 !== 0) return true;
            
            // Truncated at a suspicious point
            const trimmed = content.trim();
            if (trimmed.endsWith('def ') || trimmed.endsWith('class ') || 
                trimmed.endsWith('= ') || trimmed.endsWith('( ') ||
                trimmed.endsWith(', ') || trimmed.endsWith(': ')) return true;
            
            // Very short response that looks like it should be longer
            if (trimmed.length < 100 && trimmed.includes('```')) return true;
            
            return false;
        }

        function checkIncomplete() {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || !chat.messages.length) return;
            
            const lastMsg = chat.messages[chat.messages.length - 1];
            if (lastMsg.role === 'assistant' && isIncomplete(lastMsg.content)) {
                document.getElementById('continueBtn').style.display = 'inline';
            } else {
                document.getElementById('continueBtn').style.display = 'none';
            }
        }

        function stop() {
            if (controller) {
                controller.abort();
                controller = null;
                resetUI();
            }
        }

        function resetUI() {
            isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('sendBtn').style.display = 'inline';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('userInput').disabled = false;
            document.getElementById('userInput').focus();
        }

        async function continueGeneration() {
            if (isProcessing || !apiKey || !currentChatId) return;
            
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || !chat.messages.length) return;
            
            const lastMsg = chat.messages[chat.messages.length - 1];
            if (lastMsg.role !== 'assistant') return;
            
            // Remove incomplete message from storage
            chat.messages.pop();
            saveChats();
            
            // Remove from display
            const messagesDiv = document.getElementById('messages');
            const lastMsgDiv = messagesDiv.lastElementChild;
            if (lastMsgDiv && lastMsgDiv.classList.contains('assistant')) {
                lastMsgDiv.remove();
            }
            
            // Add continuation prompt
            const prompt = {
                role: 'user',
                content: 'Continue exactly from where you stopped. Do NOT repeat any code. Just provide the next part.'
            };
            
            chat.messages.push(prompt);
            chat.updatedAt = Date.now();
            saveChats();
            renderChatList();
            renderMessage(prompt);
            
            document.getElementById('continueBtn').style.display = 'none';
            await sendApiRequest();
        }

        async function sendApiRequest() {
            isProcessing = true;
            document.getElementById('sendBtn').style.display = 'none';
            document.getElementById('continueBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline';
            document.getElementById('userInput').disabled = true;
            
            controller = new AbortController();
            
            try {
                const chat = chats.find(c => c.id === currentChatId);
                const apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content }));
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: apiMessages,
                        stream: false
                    }),
                    signal: controller.signal
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || `Error ${response.status}`);
                }
                
                addMessage('assistant', data.choices[0].message.content);
                
            } catch (err) {
                if (err.name !== 'AbortError') {
                    addMessage('assistant', 'Error: ' + err.message);
                }
            } finally {
                resetUI();
            }
        }

        async function send() {
            if (isProcessing || !apiKey) return;
            if (!currentChatId) newChat();
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            
            document.getElementById('continueBtn').style.display = 'none';
            await sendApiRequest();
        }

        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Initialize
        if (!chats.length) newChat();
        else {
            loadChat(chats[0].id);
            checkIncomplete();
        }
    </script>
</body>
</html>
